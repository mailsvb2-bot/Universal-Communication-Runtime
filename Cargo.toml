[workspace]
resolver = "2"
members = [
    "crates/ucr-model",
    "crates/ucr-protocol",
    "crates/ucr-core",
    "crates/ucr-crypto",
    "crates/ucr-storage-memory",
    "crates/ucr-storage-sqlite",
    "crates/ucr-architecture-tests",
    "crates/ucr-security-tests",
    "crates/ucr-api-grpc",
    "crates/ucr-dev",
    "crates/ucr-runtime",
    "crates/ucr-transport-internet",
    "crates/ucr-chat",
    "crates/ucr-audio",
    "crates/ucr-video",
    "crates/ucr-media-e2ee",
    "crates/ucr-group-mls",
    "crates/ucr-media-adaptive",
    "crates/ucr-transport-orchestrator",
    "crates/ucr-offline-groups",
    "crates/ucr-store-forward",
    "crates/ucr-mesh",
    "crates/ucr-sfu",
    "crates/ucr-realtime",
    "crates/ucr-realtime-web",
    "crates/ucr-webhook",
    "crates/ucr-conference",
    "crates/ucr-bridge",
    "crates/ucr-bridge-telegram",
    "crates/ucr-bridge-vk",
    "crates/ucr-bridge-max",
    "crates/ucr-overlay",
    "crates/ucr-federation",
    "crates/ucr-personal-node",
    "crates/ucr-organization-mode",
]
exclude = ["crates/ucr-sdk", "crates/ucr-reference-messenger", "crates/ucr-ai-actor", "crates/ucr-chaos-lab"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
repository = "https://github.com/mailsvb2-bot/Universal-Communication-Runtime"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

# Canon §257 requires explicit development, test, staging, and production build profiles.
# These profiles define build mechanics only. Selecting `production` never promotes a
# Prepared capability to Production maturity and never substitutes for release evidence.
[profile.development]
inherits = "dev"

[profile.test]
opt-level = 0
debug = 2
overflow-checks = true

[profile.staging]
inherits = "release"
debug = 1
overflow-checks = true

[profile.production]
inherits = "release"
lto = "thin"
codegen-units = 1
overflow-checks = true
strip = "symbols"

[patch.crates-io]
# Phase 29: hpke-rs 0.7.0 depends unconditionally on libcrux-sha3 only for
# SHAKE256-based PQ KEM seed derivation. The local patch preserves SHAKE256
# semantics with RustCrypto sha3 and removes an unmaintained Hax macro dependency
# from the audited lockfile. See third_party/hpke-rs/UCR_PATCH.md.
hpke-rs = { path = "third_party/hpke-rs" }
