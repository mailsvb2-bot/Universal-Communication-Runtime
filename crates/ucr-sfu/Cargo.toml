[package]
name = "ucr-sfu"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ucr-core = { path = "../ucr-core" }
ucr-crypto = { path = "../ucr-crypto" }
ucr-media-e2ee = { path = "../ucr-media-e2ee" }
ucr-model = { path = "../ucr-model" }
ucr-protocol = { path = "../ucr-protocol" }

[dev-dependencies]
ucr-storage-memory = { path = "../ucr-storage-memory" }
ucr-webrtc = { path = "../ucr-webrtc" }
webrtc = "=0.17.2"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
bytes = "=1.12.1"
rustls = { version = "=0.23.45", features = ["ring"] }

[lints]
workspace = true
