[package]
name = "ucr-https-edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ucr-https-edge"
path = "src/main.rs"

[dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = "=0.26.4"

[lints]
workspace = true
