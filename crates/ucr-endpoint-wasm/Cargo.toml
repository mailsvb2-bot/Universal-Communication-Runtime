[package]
name = "ucr-endpoint-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ucr-crypto = { path = "../ucr-crypto" }
ucr-group-mls = { path = "../ucr-group-mls", default-features = false }
ucr-model = { path = "../ucr-model" }
ucr-protocol = { path = "../ucr-protocol" }
openmls = { version = "=0.9.0", features = ["js"] }
openmls_rust_crypto = "=0.6.0"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
wasm-bindgen = "=0.2.128"

[workspace]

# Match the audited OpenMLS source family used by the root workspace.
# The endpoint is a separate workspace, so the root [patch.crates-io] is NOT inherited.
# Do not declare this migration complete until Cargo has regenerated the endpoint lock
# and native/WASM/MLS cryptographic regressions pass.
[patch.crates-io]
openmls = { git = "https://github.com/openmls/openmls", rev = "be248d4b1306d87a641ce24ed0ffcab2b27967f6" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "be248d4b1306d87a641ce24ed0ffcab2b27967f6" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "be248d4b1306d87a641ce24ed0ffcab2b27967f6" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "be248d4b1306d87a641ce24ed0ffcab2b27967f6" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "be248d4b1306d87a641ce24ed0ffcab2b27967f6" }

# The registry core-models 0.0.7 was built against hax-lib 0.3.7,
# whose proc-macro-error2 dependency is unmaintained (RUSTSEC-2026-0173).
# The same upstream core-models 0.0.7 now uses workspace hax-lib >=0.4.1;
# pin the reviewed upstream commit, never replace or suppress the audit.
# Cargo must regenerate this separate workspace lock and verify native/WASM MLS.
core-models = { git = "https://github.com/celabshq/libcrux", rev = "9d5290ec8e432caad9172e4e02c9062e8fcf4b7f" }
