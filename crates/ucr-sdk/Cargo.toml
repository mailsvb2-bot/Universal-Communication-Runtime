[package]
name = "ucr-sdk"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
repository = "https://github.com/mailsvb2-bot/Universal-Communication-Runtime"
publish = false
build = "build.rs"

[dependencies]
prost = "=0.14.4"
tonic = { version = "=0.14.6", features = ["transport"] }
tonic-prost = "=0.14.6"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.6"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "deny"
pedantic = "deny"
