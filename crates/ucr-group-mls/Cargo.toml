[package]
name = "ucr-group-mls"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ucr-core = { path = "../ucr-core" }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
openmls_sqlite_storage = "=0.3.0"
openmls = "=0.9.0"
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
sha2 = "=0.11.0"
ucr-crypto = { path = "../ucr-crypto" }
ucr-model = { path = "../ucr-model" }
ucr-protocol = { path = "../ucr-protocol" }

[lints]
workspace = true
