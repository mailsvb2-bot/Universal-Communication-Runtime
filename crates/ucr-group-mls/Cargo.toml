[package]
name = "ucr-group-mls"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sqlite-storage"]
sqlite-storage = [
    "dep:openmls_sqlite_storage",
    "dep:rusqlite",
    "dep:serde",
    "dep:serde_json",
]
browser-js = ["openmls/js"]

[dependencies]
ucr-core = { path = "../ucr-core" }
serde_json = { version = "=1.0.151", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
rusqlite = { version = "=0.37.0", features = ["bundled"], optional = true }
openmls_sqlite_storage = { version = "=0.3.0", optional = true }
openmls = "=0.9.0"
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
sha2 = "=0.11.0"
ucr-crypto = { path = "../ucr-crypto" }
ucr-model = { path = "../ucr-model" }
ucr-protocol = { path = "../ucr-protocol" }

[lints]
workspace = true
