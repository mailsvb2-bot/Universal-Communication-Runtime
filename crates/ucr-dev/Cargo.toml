[package]
name = "ucr-dev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ucr"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport"] }
ucr-api-grpc = { path = "../ucr-api-grpc" }
ucr-core = { path = "../ucr-core" }
ucr-conference = { path = "../ucr-conference" }
ucr-model = { path = "../ucr-model" }
ucr-protocol = { path = "../ucr-protocol" }
ucr-realtime = { path = "../ucr-realtime" }
ucr-recording = { path = "../ucr-recording" }
ucr-secrets = { path = "../ucr-secrets" }
ucr-sfu = { path = "../ucr-sfu" }
ucr-storage-sqlite = { path = "../ucr-storage-sqlite" }
ucr-webrtc = { path = "../ucr-webrtc" }

[lints]
workspace = true
