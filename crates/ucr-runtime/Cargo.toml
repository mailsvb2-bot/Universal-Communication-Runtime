[package]
name = "ucr-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ucr-runtime"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport", "tls-ring"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
ucr-api-grpc = { path = "../ucr-api-grpc" }
ucr-core = { path = "../ucr-core" }
ucr-crypto = { path = "../ucr-crypto" }
ucr-conference = { path = "../ucr-conference" }
ucr-media-e2ee = { path = "../ucr-media-e2ee" }
ucr-model = { path = "../ucr-model" }
ucr-protocol = { path = "../ucr-protocol" }
ucr-realtime = { path = "../ucr-realtime" }
ucr-secrets = { path = "../ucr-secrets" }
ucr-sfu = { path = "../ucr-sfu" }
ucr-storage-sqlite = { path = "../ucr-storage-sqlite" }
ucr-webhook = { path = "../ucr-webhook" }
ucr-webrtc = { path = "../ucr-webrtc" }
zeroize = "=1.9.0"

[dev-dependencies]
rcgen = "=0.13.2"

[lints]
workspace = true
