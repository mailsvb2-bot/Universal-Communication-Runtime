[package]
name = "ucr-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ucr-runtime"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport", "tls-ring"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ucr-api-grpc = { path = "../ucr-api-grpc" }
ucr-core = { path = "../ucr-core" }
ucr-crypto = { path = "../ucr-crypto" }
ucr-group-mls = { path = "../ucr-group-mls" }
ucr-conference = { path = "../ucr-conference" }
ucr-media-e2ee = { path = "../ucr-media-e2ee" }
ucr-model = { path = "../ucr-model" }
ucr-protocol = { path = "../ucr-protocol" }
ucr-realtime = { path = "../ucr-realtime" }
ucr-recording = { path = "../ucr-recording" }
ucr-secrets = { path = "../ucr-secrets" }
ucr-sfu = { path = "../ucr-sfu" }
ucr-storage-sqlite = { path = "../ucr-storage-sqlite" }
ucr-webhook = { path = "../ucr-webhook" }
ucr-webrtc = { path = "../ucr-webrtc" }
zeroize = "=1.9.0"

[dev-dependencies]
rcgen = "=0.13.2"

[lints]
workspace = true
