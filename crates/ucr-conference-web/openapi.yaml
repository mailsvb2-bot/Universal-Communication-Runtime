openapi: 3.0.3
info:
  title: UCR Conference and Recording HTTP adapter
  version: v1
  description: >
    Thin JSON transport over UniversalConferenceService and RecordingService. Paths select one
    canonical gRPC RPC. Request fields match that RPC. This document is not a second business API.
paths:
  /v1/conferences:
    post:
      operationId: createConference
  /v1/conferences/resolve:
    post:
      operationId: resolveConference
  /v1/conferences/get:
    post:
      operationId: getConference
  /v1/conferences/lifecycle:
    post:
      operationId: transitionConference
  /v1/conferences/entry:
    post:
      operationId: setEntryOpen
  /v1/conferences/metadata:
    post:
      operationId: setConferenceMetadata
  /v1/participants:
    post:
      operationId: ensureParticipant
  /v1/participant-devices:
    post:
      operationId: ensureParticipantDevice
  /v1/participants/update:
    post:
      operationId: updateParticipant
  /v1/participants/remove:
    post:
      operationId: removeParticipant
  /v1/participants/list:
    post:
      operationId: listParticipants
  /v1/participants/raised-hands:
    post:
      operationId: listRaisedHands
  /v1/subscriptions:
    post:
      operationId: setSubscriptions
  /v1/conferences/runtime:
    post:
      operationId: prepareConferenceRuntime
  /v1/join-grants:
    post:
      operationId: issueJoinGrant
  /v1/join-grants/revoke:
    post:
      operationId: revokeJoinGrant
  /v1/attendance:
    post:
      operationId: getParticipantAttendance
  /v1/recordings:
    post:
      operationId: requestRecording
  /v1/recordings/get:
    post:
      operationId: getRecording
  /v1/recordings/export:
    post:
      operationId: exportRecording
  /v1/recordings/consent:
    post:
      operationId: setRecordingConsent
  /v1/recordings/start:
    post:
      operationId: startRecording
  /v1/recordings/stop:
    post:
      operationId: stopRecording
  /v1/recordings/delete:
    post:
      operationId: deleteRecording
  /v1/capabilities:
    get:
      operationId: getCapabilities
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
        - name: namespace_id
          in: query
          required: false
          schema:
            type: string
        - name: integration_id
          in: query
          required: true
          schema:
            type: string
    post:
      operationId: getCapabilitiesLegacyPost
  /v1/openapi.yaml:
    get:
      operationId: getOpenApi
  /healthz:
    get:
      operationId: healthz
