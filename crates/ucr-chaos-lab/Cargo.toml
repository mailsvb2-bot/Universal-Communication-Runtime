[package]
name = "ucr-chaos-lab"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
repository = "https://github.com/mailsvb2-bot/Universal-Communication-Runtime"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dev-dependencies]
ucr-model = { path = "../ucr-model" }
ucr-realtime = { path = "../ucr-realtime" }
ucr-webrtc = { path = "../ucr-webrtc" }

# This excluded crate is its own Cargo root: root workspace patches do not
# apply here. Reuse the exact same pinned, audited DTLS migration candidate
# as the main workspace, rather than resolving legacy crypto-bigint 0.5.5.
[patch.crates-io]
dtls = { path = "../../third_party/dtls" }
