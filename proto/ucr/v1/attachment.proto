syntax = "proto3";

package ucr.v1;

import "ucr/v1/common.proto";
import "ucr/v1/identity.proto";
import "ucr/v1/errors.proto";
import "ucr/v1/runtime.proto";

// Immutable content identity for one attachment payload.
// v1 is exactly SHA-256 over the complete attachment byte sequence.
message AttachmentContentId {
  bytes sha256 = 1;
}

// Canonical attachment metadata. Message carries only ordered attachment IDs.
// Large binary payload never belongs in Message/Event bodies.
message AttachmentDescriptor {
  OpaqueId attachment_id = 1;
  TenantScope scope = 2;
  AttachmentContentId content_id = 3;
  uint64 size_bytes = 4;
  uint32 chunk_size_bytes = 5;
  uint32 chunk_count = 6;
  optional string media_type = 7;
  optional string file_name = 8;
}

// One independently verifiable transfer chunk.
// Chunks may be transferred/retried out of order; index + offset define canonical content order.
message AttachmentChunk {
  OpaqueId attachment_id = 1;
  uint32 index = 2;
  uint64 offset_bytes = 3;
  bytes payload = 4;
  bytes sha256 = 5;
}


message AttachmentRegisterRequest {
  AttachmentDescriptor attachment = 1;
}

message AttachmentRegisterResponse {
  oneof result {
    AttachmentDescriptor attachment = 1;
    ErrorEnvelope error = 2;
  }
}

message AttachmentGetRequest {
  TenantScope scope = 1;
  OpaqueId attachment_id = 2;
}

message AttachmentGetResponse {
  oneof result {
    AttachmentDescriptor attachment = 1;
    ErrorEnvelope error = 2;
  }
}

message AttachmentPutChunkRequest {
  TenantScope scope = 1;
  AttachmentChunk chunk = 2;
}

message AttachmentPutChunkResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

message AttachmentGetChunkRequest {
  TenantScope scope = 1;
  OpaqueId attachment_id = 2;
  uint32 index = 3;
}

message AttachmentGetChunkResponse {
  oneof result {
    AttachmentChunk chunk = 1;
    ErrorEnvelope error = 2;
  }
}

message AttachmentVerifyRequest {
  TenantScope scope = 1;
  OpaqueId attachment_id = 2;
}

message AttachmentVerifyResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

// Stable resumable attachment ingress. Transport scheduling/cancellation and
// Message-to-Attachment binding remain separate canonical layers.
service AttachmentService {
  rpc RegisterAttachment(AttachmentRegisterRequest) returns (AttachmentRegisterResponse);
  rpc GetAttachment(AttachmentGetRequest) returns (AttachmentGetResponse);
  rpc PutChunk(AttachmentPutChunkRequest) returns (AttachmentPutChunkResponse);
  rpc GetChunk(AttachmentGetChunkRequest) returns (AttachmentGetChunkResponse);
  rpc VerifyAttachment(AttachmentVerifyRequest) returns (AttachmentVerifyResponse);
}
