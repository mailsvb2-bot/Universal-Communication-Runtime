syntax = "proto3";

package ucr.v1;

import "ucr/v1/common.proto";

enum SyncLinkKind {
  SYNC_LINK_KIND_UNSPECIFIED = 0;
  SYNC_LINK_KIND_DEVICE_DEVICE = 1;
  SYNC_LINK_KIND_DEVICE_NODE = 2;
  SYNC_LINK_KIND_PEER_PEER = 3;
  SYNC_LINK_KIND_DEVICE_CLOUD = 4;
}

enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  SYNC_MODE_FULL = 1;
  SYNC_MODE_PARTIAL = 2;
}

enum SyncState {
  SYNC_STATE_UNSPECIFIED = 0;
  SYNC_STATE_PREPARED = 1;
  SYNC_STATE_ACTIVE = 2;
  SYNC_STATE_PAUSED = 3;
  SYNC_STATE_COMPLETED = 4;
  SYNC_STATE_CANCELLED = 5;
  SYNC_STATE_FAILED = 6;
}
message SyncSelection {
  SyncMode mode = 1;
  repeated OpaqueId conversation_ids = 2;
}

message SyncSession {
  OpaqueId session_id = 1;
  TenantScope scope = 2;
  OpaqueId source_endpoint_id = 3;
  OpaqueId target_endpoint_id = 4;
  SyncLinkKind link_kind = 5;
  SyncSelection selection = 6;
  SyncState state = 7;
}

// Opaque resume_token is source-issued resume state. It is not a security
// authority, is not globally comparable, and does not perform anti-entropy.
message SyncCheckpoint {
  OpaqueId session_id = 1;
  TenantScope scope = 2;
  uint64 generation = 3;
  bytes resume_token = 4;
  uint64 applied_items = 5;
}

// Phase 12 Event-level Anti-Entropy. Fingerprints are versioned and compare
// canonical Event semantics; they are not signatures or authorization proof.
enum EventFingerprintAlgorithm {
  EVENT_FINGERPRINT_ALGORITHM_UNSPECIFIED = 0;
  EVENT_FINGERPRINT_ALGORITHM_SHA256_V1 = 1;
}

message EventFingerprint {
  EventFingerprintAlgorithm algorithm = 1;
  bytes digest = 2;
}

message EventSummary {
  OpaqueId event_id = 1;
  EventFingerprint fingerprint = 2;
}

// Store-private continuation state. Implementations may encode a local snapshot
// boundary inside token, but callers MUST treat it as opaque and non-comparable.
message AntiEntropyCursor {
  bytes token = 1;
}

message AntiEntropyPage {
  OpaqueId session_id = 1;
  TenantScope scope = 2;
  repeated EventSummary summaries = 3;
  AntiEntropyCursor next_cursor = 4;
}

enum EventReplicaState {
  EVENT_REPLICA_STATE_UNSPECIFIED = 0;
  EVENT_REPLICA_STATE_MISSING = 1;
  EVENT_REPLICA_STATE_MATCHING = 2;
  EVENT_REPLICA_STATE_DAMAGED = 3;
}

message EventReconciliation {
  OpaqueId event_id = 1;
  EventReplicaState state = 2;
}
