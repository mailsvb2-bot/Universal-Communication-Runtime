syntax = "proto3";

package ucr.v1;

import "ucr/v1/common.proto";
import "ucr/v1/communication.proto";
import "ucr/v1/crypto.proto";
import "ucr/v1/identity.proto";

message NegotiationHello {
  repeated VersionRange supported_versions = 1;
  repeated Capability capabilities = 2;
  repeated Extension extensions = 3;
  bytes nonce = 4;
  repeated CryptoSuite supported_crypto_suites = 5;
}

message NegotiationResult {
  ProtocolVersion version = 1;
  repeated Capability capabilities = 2;
  repeated Extension extensions = 3;
  // Legacy Phase-0 placeholder. MUST be empty in canonical negotiation results;
  // authenticated transcript binding is carried by HandshakeAuthentication.
  bytes transcript_binding = 4 [deprecated = true];
  CryptoSuite crypto_suite = 5;
}

message CommandEnvelope {
  OpaqueId command_id = 1;
  TenantScope scope = 2;
  string command_type = 3;
  bytes payload = 4;
  Correlation correlation = 5;
  ProtocolVersion schema_version = 6;
  repeated Extension extensions = 7;
}

message EventEnvelope {
  OpaqueId event_id = 1;
  TenantScope scope = 2;
  string event_type = 3;
  bytes payload = 4;
  uint64 logical_order = 5;
  Correlation correlation = 6;
  ProtocolVersion schema_version = 7;
  bytes integrity_metadata = 8;
  repeated Extension extensions = 9;
  ActorRef actor = 10;
  DeviceRef source_device = 11;
  int64 wall_time_unix_ms = 12;
}

enum CommandReceiptStatus {
  COMMAND_RECEIPT_STATUS_UNSPECIFIED = 0;
  COMMAND_RECEIPT_STATUS_ACCEPTED = 1;
  COMMAND_RECEIPT_STATUS_DUPLICATE = 2;
}

// A command receipt acknowledges acceptance/deduplication only. It is not an
// Event and is not evidence that the requested real-world effect occurred.
message CommandReceipt {
  OpaqueId command_id = 1;
  CommandReceiptStatus status = 2;
  optional OpaqueId original_command_id = 3;
  ProtocolVersion schema_version = 4;
  repeated Extension extensions = 5;
}

message AcknowledgementEnvelope {
  OpaqueId acknowledged_id = 1;
  ProtocolVersion schema_version = 2;
  repeated Extension extensions = 3;
}
