syntax = "proto3";

package ucr.v1;

import "ucr/v1/common.proto";
import "ucr/v1/crypto.proto";
import "ucr/v1/identity.proto";

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_PRIVATE_GROUP = 2;
  CONVERSATION_KIND_PUBLIC_GROUP = 3;
  CONVERSATION_KIND_BROADCAST = 4;
  CONVERSATION_KIND_COMMUNITY = 5;
  CONVERSATION_KIND_ROOM = 6;
  CONVERSATION_KIND_TOPIC = 7;
  CONVERSATION_KIND_THREAD = 8;
  CONVERSATION_KIND_SYSTEM = 9;
}

enum DeliveryPolicy {
  DELIVERY_POLICY_UNSPECIFIED = 0;
  DELIVERY_POLICY_BEST_EFFORT = 1;
  DELIVERY_POLICY_DURABLE = 2;
  DELIVERY_POLICY_URGENT = 3;
  DELIVERY_POLICY_EXPIRING = 4;
  DELIVERY_POLICY_LOCAL_ONLY = 5;
  DELIVERY_POLICY_DIRECT_ONLY = 6;
  DELIVERY_POLICY_NO_RELAY = 7;
  DELIVERY_POLICY_NO_EXTERNAL_BRIDGE = 8;
  DELIVERY_POLICY_PRIVATE_NETWORK_ONLY = 9;
}

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_CREATED = 1;
  DELIVERY_STATE_PERSISTED = 2;
  DELIVERY_STATE_ENCRYPTED = 3;
  DELIVERY_STATE_QUEUED = 4;
  DELIVERY_STATE_ROUTE_PLANNED = 5;
  DELIVERY_STATE_IN_FLIGHT = 6;
  DELIVERY_STATE_ACKNOWLEDGED = 7;
  DELIVERY_STATE_DELIVERED = 8;
  DELIVERY_STATE_READ = 9;
  DELIVERY_STATE_FAILED = 10;
  DELIVERY_STATE_EXPIRED = 11;
}

enum MessageRelationKind {
  MESSAGE_RELATION_KIND_UNSPECIFIED = 0;
  MESSAGE_RELATION_KIND_REPLY = 1;
  MESSAGE_RELATION_KIND_QUOTE = 2;
  MESSAGE_RELATION_KIND_EDIT = 3;
  MESSAGE_RELATION_KIND_REACTION = 4;
  MESSAGE_RELATION_KIND_THREAD_PARENT = 5;
  MESSAGE_RELATION_KIND_FORWARD = 6;
  MESSAGE_RELATION_KIND_REFERENCE = 7;
}

message ConversationRef {
  OpaqueId conversation_id = 1;
  ConversationKind kind = 2;
}

message ConversationRecord {
  TenantScope scope = 1;
  ConversationRef conversation = 2;
  optional OpaqueId parent_conversation_id = 3;
}

message MessageRelation {
  MessageRelationKind kind = 1;
  OpaqueId target_message_id = 2;
}

message ExternalMessageMapping {
  OpaqueId integration_id = 1;
  bytes external_message_id = 2;
}

message MessageCryptoMetadata {
  CryptoSuite suite = 1;
  optional OpaqueId key_id = 2;
  bytes opaque_metadata = 3;
}

message MessageSignature {
  OpaqueId key_id = 1;
  string algorithm_id = 2;
  uint32 algorithm_version = 3;
  bytes signature = 4;
}

message OriginRef {
  optional OpaqueId principal_id = 1;
  optional OpaqueId endpoint_id = 2;
  optional OpaqueId integration_id = 3;
}

message IntentConstraints {
  repeated string allowed_transport_capabilities = 1;
  repeated string forbidden_transport_capabilities = 2;
  optional string privacy_profile = 3;
  optional string region_constraint = 4;
  optional uint64 max_cost_microunits = 5;
  optional uint32 priority_class = 6;
}

message CommunicationIntent {
  OpaqueId intent_id = 1;
  TenantScope scope = 2;
  OpaqueId target_identity_id = 3;
  bytes payload = 4;
  IntentConstraints constraints = 5;
  Correlation correlation = 6;
  repeated Extension extensions = 7;
}

message MessageEnvelope {
  OpaqueId message_id = 1;
  TenantScope scope = 2;
  ConversationRef conversation = 3;
  ActorRef author = 4;
  optional DeviceRef author_device = 5;
  uint64 logical_order = 6;
  bytes content = 7;
  DeliveryPolicy delivery_policy = 8;
  Correlation correlation = 9;
  repeated Extension extensions = 10;
  OriginRef origin = 11;
  int64 created_at_unix_ms = 12;
  repeated OpaqueId attachment_ids = 13;
  repeated MessageRelation relations = 14;
  optional MessageCryptoMetadata crypto_metadata = 15;
  DeliveryState delivery_state = 16;
  repeated ExternalMessageMapping external_mappings = 17;
  optional MessageSignature signature = 18;
  optional OpaqueId reply_to = 19;
}
