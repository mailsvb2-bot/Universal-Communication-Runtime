syntax = "proto3";

package ucr.v1;

import "ucr/v1/common.proto";

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_MALFORMED_FRAME = 2;
  ERROR_CODE_UNSUPPORTED_PROTOCOL_VERSION = 3;
  ERROR_CODE_DOWNGRADE_REJECTED = 4;
  ERROR_CODE_UNSUPPORTED_CRITICAL_EXTENSION = 5;
  ERROR_CODE_CAPABILITY_MISMATCH = 6;
  ERROR_CODE_UNAUTHENTICATED = 7;
  ERROR_CODE_PERMISSION_DENIED = 8;
  ERROR_CODE_POLICY_DENIED = 9;
  ERROR_CODE_RATE_LIMITED = 10;
  ERROR_CODE_RESOURCE_EXHAUSTED = 11;
  ERROR_CODE_DEADLINE_EXCEEDED = 12;
  ERROR_CODE_CANCELLED = 13;
  ERROR_CODE_TEMPORARILY_UNAVAILABLE = 14;
  ERROR_CODE_INTEGRITY_FAILURE = 15;
  ERROR_CODE_CONFLICT = 16;
  ERROR_CODE_NOT_FOUND = 17;
  ERROR_CODE_INTERNAL = 18;
}

message ErrorEnvelope {
  ErrorCode code = 1;
  bool retryable = 2;
  optional uint64 retry_after_ms = 3;
  string diagnostic_domain = 4;
  repeated Extension extensions = 5;
}
