syntax = "proto3";

package ucr.v1;

import "ucr/v1/adaptive_media.proto";
import "ucr/v1/common.proto";
import "ucr/v1/conference.proto";
import "ucr/v1/errors.proto";
import "ucr/v1/identity.proto";
import "ucr/v1/runtime.proto";
import "ucr/v1/sfu.proto";

// Join credentials are transport metadata, never copied into this message or durable canonical
// state. A successful join binds the short-lived token to this exact scope/call/session.
message RealtimeJoinRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
}

enum RealtimeAdmissionState {
  REALTIME_ADMISSION_STATE_UNSPECIFIED = 0;
  REALTIME_ADMISSION_STATE_WAITING_ROOM = 1;
  REALTIME_ADMISSION_STATE_ADMITTED = 2;
  REALTIME_ADMISSION_STATE_CLOSED = 3;
}

message RealtimeMediaPolicy {
  optional bool publish_audio_allowed = 1;
  optional bool publish_camera_allowed = 2;
  optional bool screen_share_allowed = 3;
}

message RealtimeSession {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  PrincipalRef participant = 4;
  optional OpaqueId device_id = 5;
  int64 expires_at_unix_ms = 6;
  uint64 heartbeat_interval_ms = 7;
  RealtimeAdmissionState admission_state = 8;
  optional RealtimeMediaPolicy media_policy = 9;
}

message RealtimeJoinResponse {
  oneof result {
    RealtimeSession session = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeHeartbeatRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  uint64 expected_session_sequence = 4;
}

message RealtimeHeartbeatResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
  RealtimeAdmissionState admission_state = 3;
  optional RealtimeMediaPolicy media_policy = 4;
}

message RealtimeLeaveRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
}

message RealtimeLeaveResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

// The source Principal/Device is taken from authenticated session state and revalidated against
// the encrypted frame header plus canonical Call/Group/MLS state before any SFU sink side effect.
message RealtimePublishMediaRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  SfuForwardEnvelope envelope = 4;
}

message RealtimePublishMediaReceipt {
  OpaqueId call_id = 1;
  OpaqueId session_id = 2;
  uint32 accepted_recipient_count = 3;
}

message RealtimePublishMediaResponse {
  oneof result {
    RealtimePublishMediaReceipt receipt = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeSubscribeMediaRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
}

// Contains exactly the already-encrypted SFU envelope accepted for this authenticated recipient.
message RealtimeDownlinkMedia {
  SfuForwardEnvelope envelope = 1;
}

message RealtimeSetSubscriptionsRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  repeated ConferenceMediaSubscription subscriptions = 4;
}

message RealtimeSetSubscriptionsResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeSetRaisedHandRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  bool raised = 4;
}

message RealtimeSetRaisedHandResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimePublishReactionRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  string reaction = 4;
}

message RealtimeReactionReceipt {
  uint64 sequence = 1;
}

message RealtimePublishReactionResponse {
  oneof result {
    RealtimeReactionReceipt receipt = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeListReactionsRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  uint64 after_sequence = 4;
  uint32 max_items = 5;
}

message RealtimeReaction {
  uint64 sequence = 1;
  PrincipalRef participant = 2;
  string reaction = 3;
}

message RealtimeReactionList {
  repeated RealtimeReaction reactions = 1;
}

message RealtimeListReactionsResponse {
  oneof result {
    RealtimeReactionList reactions = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeReportAdaptiveMediaRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  AdaptiveMediaTelemetry telemetry = 4;
}

message RealtimeReportAdaptiveMediaResponse {
  oneof result {
    AdaptiveMediaDecision decision = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeReportAudioLevelRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  uint32 level = 4;
}

message RealtimeReportAudioLevelResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeGetActiveSpeakerRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
}

message RealtimeActiveSpeaker {
  optional PrincipalRef participant = 1;
}

message RealtimeGetActiveSpeakerResponse {
  oneof result {
    RealtimeActiveSpeaker active_speaker = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeSendChatMessageRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  OpaqueId message_id = 4;
  int64 created_at_unix_ms = 5;
  OpaqueId correlation_id = 6;
  optional string idempotency_key = 7;
  bytes content = 8;
}

message RealtimeChatMessageReceipt {
  OpaqueId message_id = 1;
}

message RealtimeSendChatMessageResponse {
  oneof result {
    RealtimeChatMessageReceipt receipt = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeGetChatMessageRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  OpaqueId message_id = 4;
}

message RealtimeChatMessage {
  OpaqueId message_id = 1;
  ActorRef author = 2;
  int64 created_at_unix_ms = 3;
  uint64 logical_order = 4;
  bytes content = 5;
}

message RealtimeGetChatMessageResponse {
  oneof result {
    RealtimeChatMessage message = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeListChatMessagesRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  uint64 after_sequence = 4;
  uint32 max_items = 5;
}

message RealtimeSequencedChatMessage {
  uint64 sequence = 1;
  RealtimeChatMessage message = 2;
}

message RealtimeChatMessageList {
  repeated RealtimeSequencedChatMessage messages = 1;
  uint64 next_sequence = 2;
}

message RealtimeListChatMessagesResponse {
  oneof result {
    RealtimeChatMessageList messages = 1;
    ErrorEnvelope error = 2;
  }
}

enum WebRtcSdpType {
  WEB_RTC_SDP_TYPE_UNSPECIFIED = 0;
  WEB_RTC_SDP_TYPE_OFFER = 1;
  WEB_RTC_SDP_TYPE_ANSWER = 2;
}

message WebRtcIceServer {
  repeated string urls = 1;
  optional string username = 2;
  optional string credential = 3;
}

message WebRtcDescription {
  WebRtcSdpType sdp_type = 1;
  string sdp = 2;
}

message RealtimeStartWebRtcRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
}

message RealtimeWebRtcOffer {
  WebRtcDescription description = 1;
  repeated WebRtcIceServer ice_servers = 2;
}

message RealtimeStartWebRtcResponse {
  oneof result {
    RealtimeWebRtcOffer offer = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeSetWebRtcRemoteDescriptionRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  WebRtcDescription description = 4;
}

message RealtimeSetWebRtcRemoteDescriptionResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeAddWebRtcIceCandidateRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
  string candidate = 4;
  optional string sdp_mid = 5;
  optional uint32 sdp_mline_index = 6;
}

message RealtimeAddWebRtcIceCandidateResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeRestartWebRtcRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
}

message RealtimeRestartWebRtcResponse {
  oneof result {
    RealtimeWebRtcOffer offer = 1;
    ErrorEnvelope error = 2;
  }
}

message RealtimeCloseWebRtcRequest {
  TenantScope scope = 1;
  OpaqueId call_id = 2;
  OpaqueId session_id = 3;
}

message RealtimeCloseWebRtcResponse {
  oneof result {
    AcknowledgementEnvelope acknowledgement = 1;
    ErrorEnvelope error = 2;
  }
}

service RealtimeService {
  rpc JoinRealtime(RealtimeJoinRequest) returns (RealtimeJoinResponse);
  rpc HeartbeatRealtime(RealtimeHeartbeatRequest) returns (RealtimeHeartbeatResponse);
  rpc LeaveRealtime(RealtimeLeaveRequest) returns (RealtimeLeaveResponse);
  rpc SetSubscriptions(RealtimeSetSubscriptionsRequest) returns (RealtimeSetSubscriptionsResponse);
  rpc SetRaisedHand(RealtimeSetRaisedHandRequest) returns (RealtimeSetRaisedHandResponse);
  rpc PublishReaction(RealtimePublishReactionRequest) returns (RealtimePublishReactionResponse);
  rpc ListReactions(RealtimeListReactionsRequest) returns (RealtimeListReactionsResponse);
  rpc ReportAdaptiveMedia(RealtimeReportAdaptiveMediaRequest) returns (RealtimeReportAdaptiveMediaResponse);
  rpc ReportAudioLevel(RealtimeReportAudioLevelRequest) returns (RealtimeReportAudioLevelResponse);
  rpc GetActiveSpeaker(RealtimeGetActiveSpeakerRequest) returns (RealtimeGetActiveSpeakerResponse);
  rpc SendChatMessage(RealtimeSendChatMessageRequest) returns (RealtimeSendChatMessageResponse);
  rpc GetChatMessage(RealtimeGetChatMessageRequest) returns (RealtimeGetChatMessageResponse);
  rpc ListChatMessages(RealtimeListChatMessagesRequest) returns (RealtimeListChatMessagesResponse);
  rpc PublishMedia(RealtimePublishMediaRequest) returns (RealtimePublishMediaResponse);
  rpc SubscribeMedia(RealtimeSubscribeMediaRequest) returns (stream RealtimeDownlinkMedia);
  rpc StartWebRtc(RealtimeStartWebRtcRequest) returns (RealtimeStartWebRtcResponse);
  rpc SetWebRtcRemoteDescription(RealtimeSetWebRtcRemoteDescriptionRequest) returns (RealtimeSetWebRtcRemoteDescriptionResponse);
  rpc AddWebRtcIceCandidate(RealtimeAddWebRtcIceCandidateRequest) returns (RealtimeAddWebRtcIceCandidateResponse);
  rpc RestartWebRtc(RealtimeRestartWebRtcRequest) returns (RealtimeRestartWebRtcResponse);
  rpc CloseWebRtc(RealtimeCloseWebRtcRequest) returns (RealtimeCloseWebRtcResponse);
}
