syntax = "proto3";

package ucr.v1;

import "ucr/v1/common.proto";

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_PERSON = 1;
  PRINCIPAL_KIND_DEVICE = 2;
  PRINCIPAL_KIND_SERVICE_ACCOUNT = 3;
  PRINCIPAL_KIND_AI_AGENT = 4;
  PRINCIPAL_KIND_BOT = 5;
  PRINCIPAL_KIND_ORGANIZATION = 6;
  PRINCIPAL_KIND_AUTOMATION = 7;
  PRINCIPAL_KIND_EXTERNAL_PLATFORM = 8;
}

enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_PERSON = 1;
  ACTOR_KIND_AI_AGENT = 2;
  ACTOR_KIND_BOT = 3;
  ACTOR_KIND_ORGANIZATION = 4;
  ACTOR_KIND_SYSTEM = 5;
}
enum EndpointKind {
  ENDPOINT_KIND_UNSPECIFIED = 0;
  ENDPOINT_KIND_DEVICE = 1;
  ENDPOINT_KIND_EXTERNAL_ACCOUNT = 2;
  ENDPOINT_KIND_WEB_SESSION = 3;
  ENDPOINT_KIND_PERSONAL_NODE = 4;
  ENDPOINT_KIND_ORGANIZATION_NODE = 5;
  ENDPOINT_KIND_TEMPORARY_PEER = 6;
}

message PrincipalRef {
  OpaqueId principal_id = 1;
  PrincipalKind kind = 2;
}

message ActorRef {
  OpaqueId actor_id = 1;
  ActorKind kind = 2;
  optional OpaqueId on_behalf_of = 3;
}

message DeviceRef {
  OpaqueId device_id = 1;
  OpaqueId identity_id = 2;
}
message EndpointAddress {
  string scheme = 1;
  bytes value = 2;
}

message EndpointRef {
  OpaqueId endpoint_id = 1;
  optional OpaqueId identity_id = 2;
}

message EndpointDescriptor {
  OpaqueId endpoint_id = 1;
  EndpointKind kind = 2;
  optional OpaqueId identity_id = 3;
  optional OpaqueId device_id = 4;
  repeated Capability capabilities = 5;
  repeated EndpointAddress addresses = 6;
}

message ExternalIdentityBinding {
  TenantScope scope = 1;
  OpaqueId integration_id = 2;
  string external_namespace = 3;
  bytes external_entity_id = 4;
  OpaqueId identity_id = 5;
}
