syntax = "proto3";

package ucr.v1;

import "ucr/v1/common.proto";
import "ucr/v1/communication.proto";
import "ucr/v1/errors.proto";
import "ucr/v1/identity.proto";
import "ucr/v1/runtime.proto";

// Phase-13 public command ingress. Authentication credentials are presented by the
// concrete API binding and are deliberately not copied into the canonical command body.
message IntegrationCommandRequest {
  CommandEnvelope command = 1;
}

message IntegrationCommandResponse {
  oneof result {
    CommandReceipt receipt = 1;
    ErrorEnvelope error = 2;
  }
}

// Public canonical Root Identity creation. Credential presentation belongs to the concrete
// binding, never to this request body. Equal retries are idempotent at the durable owner.
message IntegrationCreateIdentityRequest {
  IdentityRecord identity = 1;
}

message IntegrationCreateIdentityResponse {
  oneof result {
    IdentityRecord identity = 1;
    ErrorEnvelope error = 2;
  }
}

// Public semantic Identity-link operation over the canonical ExternalIdentityBinding.
// Credential presentation belongs to the concrete binding, never to this request body.
message IntegrationLinkIdentityRequest {
  ExternalIdentityBinding binding = 1;
}

message IntegrationLinkIdentityResponse {
  oneof result {
    ExternalIdentityBinding binding = 1;
    ErrorEnvelope error = 2;
  }
}

// Public exact-scope Root Identity lookup. Absence is reported only after authenticated
// authorization and uses the canonical NOT_FOUND error.
message IntegrationGetIdentityRequest {
  TenantScope scope = 1;
  OpaqueId identity_id = 2;
}

message IntegrationGetIdentityResponse {
  oneof result {
    IdentityRecord identity = 1;
    ErrorEnvelope error = 2;
  }
}

// Resolves one exact integration-scoped external key through the canonical binding owner.
// External entity bytes remain request data and are not promoted into canonical Identity.
message IntegrationResolveIdentityBindingRequest {
  TenantScope scope = 1;
  OpaqueId integration_id = 2;
  string external_namespace = 3;
  bytes external_entity_id = 4;
}

message IntegrationResolveIdentityBindingResponse {
  oneof result {
    ExternalIdentityBinding binding = 1;
    ErrorEnvelope error = 2;
  }
}

// Public canonical Conversation creation. Equal retries are delegated to the existing
// provider-independent Conversation owner; credential presentation stays binding-specific.
message IntegrationCreateConversationRequest {
  ConversationRecord conversation = 1;
}

message IntegrationCreateConversationResponse {
  oneof result {
    ConversationRecord conversation = 1;
    ErrorEnvelope error = 2;
  }
}

// Public exact-scope Conversation lookup. NOT_FOUND is returned only after authenticated
// authorization so callers cannot use this method as a Conversation-existence oracle.
message IntegrationGetConversationRequest {
  TenantScope scope = 1;
  OpaqueId conversation_id = 2;
}

message IntegrationGetConversationResponse {
  oneof result {
    ConversationRecord conversation = 1;
    ErrorEnvelope error = 2;
  }
}

service IntegrationService {
  rpc SubmitCommand(IntegrationCommandRequest) returns (IntegrationCommandResponse);
  rpc CreateIdentity(IntegrationCreateIdentityRequest) returns (IntegrationCreateIdentityResponse);
  rpc LinkIdentity(IntegrationLinkIdentityRequest) returns (IntegrationLinkIdentityResponse);
  rpc GetIdentity(IntegrationGetIdentityRequest) returns (IntegrationGetIdentityResponse);
  rpc ResolveIdentityBinding(IntegrationResolveIdentityBindingRequest) returns (IntegrationResolveIdentityBindingResponse);
  rpc CreateConversation(IntegrationCreateConversationRequest) returns (IntegrationCreateConversationResponse);
  rpc GetConversation(IntegrationGetConversationRequest) returns (IntegrationGetConversationResponse);
}
