# Deploy as an nginx server template (replace host and certificate paths).
# ONE HTTPS origin serves both the reference browser app and the canonical
# loopback-only first-party BFF. Never expose either upstream on a public IP.
# Before enablement, provision canonical UCR SQLite and exact env:
# UCR_FIRST_PARTY_BIND=127.0.0.1:18081
# UCR_FIRST_PARTY_PUBLIC_ORIGIN=https://call.example.invalid
# UCR_FIRST_PARTY_SELF_SERVICE_TENANT=public-self-service
# The gateway must listen on 127.0.0.1:8080.
# This template alone is NOT a deployed endpoint or identity proof.

# Per-client quota for anonymous account/login/recovery challenges. The BFF
# itself keeps no per-request state for unproven challenges (no global lockout);
# this bounds account creation per client address at the trusted edge.
limit_req_zone $binary_remote_addr zone=ucr_first_party_anon:10m rate=30r/m;

server {
    listen 80;
    server_name call.example.invalid;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name call.example.invalid;
    ssl_certificate /etc/letsencrypt/live/call.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # BFF independently verifies exact Origin, custom request header,
    # httpOnly SameSite Secure cookies and current canonical Device trust.
    location ^~ /v1/first-party/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:18081;

        # Nested: a regex location next to `^~` would never be consulted.
        location ~ ^/v1/first-party/(signup|login|recover)/ {
            limit_req zone=ucr_first_party_anon burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 16k;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_pass http://127.0.0.1:18081;
        }
    }

    # The browser must use the SAME origin as first-party authentication.
    # No cross-origin token forwarding or Service Principal keys.
    location / {
        client_max_body_size 2m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8080;
    }
}
