services:
  ucr:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    init: true
    ports:
      - "127.0.0.1:50051:150051/tcp"
      - "127.0.0.1:8080:8080/tcp"
      - "127.0.0.1:8090:8090/tcp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:49160-49170:49160-49170/udp"
    environment:
      UCR_DEV_TURN_SECRET: "0123456789abcdef0123456789abcdef"
      UCR_DEV_TURN_REALM: "ucr-dev.local"
    tmpfs:
      - /run/ucr
      - /tmp
