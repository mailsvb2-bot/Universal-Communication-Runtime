name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-matrix:
    name: sdk-${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, kotlin, swift]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate common Phase-41 matrix
        run: python3 sdk/conformance/validate.py
      - name: Run language host probe
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.language }}" in
            python)
              PYTHONPATH=sdk/python python3 sdk/python/phase41_conformance.py
              PYTHONPATH=sdk/python python3 sdk/python/conference_client_conformance.py
              ;;
            typescript)
              node --experimental-strip-types sdk/typescript/phase41_conformance.ts
              node --experimental-strip-types sdk/typescript/sfu_forward_wire_conformance.ts
              node --experimental-strip-types sdk/typescript/endpoint_e2ee_conformance.ts
              node --experimental-strip-types sdk/typescript/conference_embed_conformance.ts
              node --experimental-strip-types sdk/typescript/conference_client_conformance.ts
              ;;
            kotlin)
              kotlinc \
                sdk/kotlin/src/main/kotlin/org/ucr/sdk/ServiceCredential.kt \
                sdk/kotlin/src/test/kotlin/org/ucr/sdk/Phase41Conformance.kt \
                -include-runtime -d /tmp/ucr-phase41-kotlin.jar
              java -jar /tmp/ucr-phase41-kotlin.jar
              ;;
            swift)
              swiftc \
                sdk/swift/Sources/UCRSDK/ServiceCredential.swift \
                sdk/swift/Tests/main.swift \
                -o /tmp/ucr-phase41-swift
              /tmp/ucr-phase41-swift
              ;;
            *)
              echo "unknown Phase-41 SDK language" >&2
              exit 2
              ;;
          esac

  reference-integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Python reference integration self-test
        run: python3 examples/reference-integrations/python_backend.py --self-test
      - name: Node reference integration self-test
        run: node examples/reference-integrations/node_backend.mjs --self-test
      - name: Keep browser examples credential-free and on canonical join boundary
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/reference-integrations/simple-html/index.html examples/reference-integrations/mobile-web/index.html; do
            grep -F '#ucr_join' "$file"
            grep -F 'camera; microphone; display-capture; fullscreen' "$file"
            if grep -Eq 'UCR_ACCESS_TOKEN|Authorization:[[:space:]]*Bearer|client_secret' "$file"; then
              echo "browser reference integration contains a machine credential surface: $file" >&2
              exit 1
            fi
          done
      - name: Keep backend examples on the universal public contract
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/reference-integrations/python_backend.py examples/reference-integrations/node_backend.mjs; do
            grep -F '/v1/conferences' "$file"
            grep -F '/v1/participants' "$file"
            grep -F '/v1/participant-devices' "$file"
            grep -F '/v1/conferences/runtime' "$file"
            grep -F '/v1/join-grants' "$file"
            if grep -Eiq 'clientplatform|PrincipalId|DeviceId|CallId|GroupId' "$file"; then
              echo "reference integration leaked product-specific or internal UCR identifiers: $file" >&2
              exit 1
            fi
          done

  rust-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Validate common Phase-41 matrix
        run: python3 sdk/conformance/validate.py
      - name: Rust runtime-binding conformance
        run: cargo test --manifest-path crates/ucr-sdk/Cargo.toml --test phase41_conformance

  integration-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v cmake >/dev/null &&
             command -v cc >/dev/null &&
             command -v c++ >/dev/null &&
             command -v make >/dev/null; then
            echo "native build dependencies already present"
          else
            bash tools/ci_install_apt_packages.sh cmake build-essential
          fi
          cmake --version
          cc --version
          c++ --version
          make --version
      - name: Universal integration runtime-binding conformance
        run: cargo run --locked -p ucr-dev -- dev --check

  public-webhook:
    name: public-https-webhook
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      UCR_PUBLIC_WEBHOOK_CONFORMANCE_URL: https://postman-echo.com/post
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Real public HTTPS webhook delivery
        run: >-
          cargo test --locked -p ucr-webhook --test public_https_conformance
          dispatcher_delivers_over_real_public_https_and_acks -- --ignored --exact

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate Phase-41 matrix
        run: python3 sdk/conformance/validate.py
      - name: Install protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null; then
            bash tools/ci_install_apt_packages.sh protobuf-compiler
          fi
          protoc --version
      - name: Compile canonical public contract
        run: protoc --proto_path=proto --descriptor_set_out=/tmp/ucr-phase41.pb proto/ucr/v1/*.proto
