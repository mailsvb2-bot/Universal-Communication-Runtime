name: Format canonical pending-delivery candidate
on:
  pull_request:
    paths:
      - '.github/workflows/pending-delivery-rustfmt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'feat/canonical-pending-delivery-index-20261024'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/canonical-pending-delivery-index-20261024
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt
      - name: Format and commit candidate
        run: |
          set -euo pipefail
          cargo fmt --all
          git add -- crates/ucr-core/src/lib.rs crates/ucr-core/src/authorized_runtime.rs crates/ucr-storage-memory/src/lib.rs crates/ucr-storage-sqlite/src/delivery_store.rs
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(delivery): format pending index implementation'
          git push origin HEAD:feat/canonical-pending-delivery-index-20261024
