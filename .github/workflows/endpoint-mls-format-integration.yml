name: Format endpoint MLS integration
on:
  push:
    branches: [fix/endpoint-mls-owned-transitions-20261026]
    paths: [.github/workflows/endpoint-mls-format-integration.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format actual Rust sources
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ucr-runtime/src/first_party_web.rs crates/ucr-runtime/src/first_party_acceptance.rs crates/ucr-runtime/src/first_party_media.rs crates/ucr-storage-sqlite/src/endpoint_mls_offer_store.rs crates/ucr-storage-sqlite/src/group_mls_store.rs crates/ucr-storage-sqlite/src/lib.rs crates/ucr-group-mls/src/lib.rs
          if ! git diff --quiet -- crates; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- crates
            git commit -m "style(e2ee): rustfmt atomic endpoint MLS Call/Join migration"
            git push origin HEAD:fix/endpoint-mls-owned-transitions-20261026
          fi
