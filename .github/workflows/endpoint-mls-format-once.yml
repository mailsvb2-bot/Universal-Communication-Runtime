name: Endpoint MLS Rustfmt once
on:
  push:
    branches: [fix/endpoint-mls-owned-transitions-20261026]
    paths: [.github/workflows/endpoint-mls-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - name: Format real Rust code
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --all
          if ! git diff --quiet -- crates; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "style(e2ee): format integrated endpoint-owned MLS code"
            git push origin HEAD:fix/endpoint-mls-owned-transitions-20261026
          fi
