name: Format endpoint MLS migration
on:
  push:
    branches: [fix/endpoint-mls-owned-transitions-20261026]
    paths: [.github/workflows/endpoint-mls-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ucr-runtime/src/first_party_media.rs crates/ucr-group-mls/src/lib.rs crates/ucr-endpoint-wasm/src/lib.rs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- crates/ucr-runtime/src/first_party_media.rs crates/ucr-group-mls/src/lib.rs crates/ucr-endpoint-wasm/src/lib.rs
            git commit -m "style(e2ee): format endpoint-only MLS runtime migration"
            git push origin HEAD:fix/endpoint-mls-owned-transitions-20261026
          fi
