name: Signalling Lock Refresh

on:
  push:
    branches: [webrtc-public-signalling]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signalling-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Resolve workspace lock
        run: cargo generate-lockfile
      - name: Commit generated lock when changed
        run: |
          set -euo pipefail
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: refresh signalling dependency lock"
            git push
          fi
      - name: Check signalling crates
        run: cargo check -p ucr-api-grpc -p ucr-runtime -p ucr-realtime-web --locked
