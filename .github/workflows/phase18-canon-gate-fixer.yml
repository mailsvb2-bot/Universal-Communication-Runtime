name: Phase18 Canon Gate Fixer

on:
  push:
    branches: [phase18-groups]
    paths:
      - .github/workflows/phase18-canon-gate-fixer.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: phase18-groups
      - name: Apply canon gate fix
        run: python3 .github/phase18_canon_gate_fix.py
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Strict Clippy workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Release architecture tests
        run: cargo test -p ucr-architecture-tests --release --locked
      - name: Commit verified source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucr-architecture-tests/tests/canon_gates.rs docs/adr/0028-tenant-scoped-durable-runtime-operations-require-explicit-permissions.md spec/permissions.md
          git commit -m "Future-proof Phase 18 architecture gates"
          git push origin HEAD:phase18-groups
