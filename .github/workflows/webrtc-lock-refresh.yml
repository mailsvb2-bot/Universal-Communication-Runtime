name: WebRTC Lock Refresh

on:
  push:
    branches: [webrtc-live-peer-engine]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webrtc-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install native prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake build-essential
      - name: Resolve exact dependency lock
        run: cargo generate-lockfile
      - name: Commit generated lock when changed
        run: |
          set -euo pipefail
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: refresh WebRTC dependency lock"
            git push
          fi
      - name: Format live WebRTC slice
        run: cargo fmt --all -- --check
      - name: Check live WebRTC slice
        run: cargo check -p ucr-webrtc
      - name: Clippy live WebRTC slice
        run: cargo clippy -p ucr-webrtc --all-targets -- -D warnings
      - name: Test live WebRTC peer lifecycle
        run: cargo test -p ucr-webrtc -- --nocapture
