name: Phase 44 Lockfiles Bootstrap

on:
  push:
    branches: [phase44-supply-chain-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase44-lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Generate standalone lockfiles
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/ucr-sdk/Cargo.toml
          cargo generate-lockfile --manifest-path crates/ucr-reference-messenger/Cargo.toml
          cargo generate-lockfile --manifest-path crates/ucr-ai-actor/Cargo.toml
          cargo generate-lockfile --manifest-path crates/ucr-chaos-lab/Cargo.toml
      - name: Collect lockfiles
        run: |
          set -euo pipefail
          mkdir -p phase44-lockfiles/crates/ucr-sdk
          mkdir -p phase44-lockfiles/crates/ucr-reference-messenger
          mkdir -p phase44-lockfiles/crates/ucr-ai-actor
          mkdir -p phase44-lockfiles/crates/ucr-chaos-lab
          cp crates/ucr-sdk/Cargo.lock phase44-lockfiles/crates/ucr-sdk/Cargo.lock
          cp crates/ucr-reference-messenger/Cargo.lock phase44-lockfiles/crates/ucr-reference-messenger/Cargo.lock
          cp crates/ucr-ai-actor/Cargo.lock phase44-lockfiles/crates/ucr-ai-actor/Cargo.lock
          cp crates/ucr-chaos-lab/Cargo.lock phase44-lockfiles/crates/ucr-chaos-lab/Cargo.lock
      - name: Upload generated locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase44-standalone-lockfiles-${{ github.sha }}
          path: phase44-lockfiles/
          if-no-files-found: error
          retention-days: 1
