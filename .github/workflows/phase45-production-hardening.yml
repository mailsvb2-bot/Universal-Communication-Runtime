name: Phase 45 Production Hardening

on:
  push:
    branches: [main, phase45-production-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase45-production-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install native and contract build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake build-essential protobuf-compiler

      - name: Readiness verifier adversarial self-test
        run: python3 tools/production_readiness.py self-test

      - name: Platform signing verifier self-test
        run: python3 tools/platform_signing.py self-test

      - name: Phase 45 architecture lock
        run: cargo test --locked -p ucr-architecture-tests --test phase45_production_hardening

      - name: Prove canonical build profiles are executable
        run: |
          set -euo pipefail
          cargo check --locked --profile development -p ucr-core
          cargo test --locked -p ucr-core --no-run
          cargo check --locked --profile staging -p ucr-core
          cargo check --locked --profile production -p ucr-core

      - name: Candidate security gate
        run: cargo test --locked -p ucr-security-tests

      - name: Candidate data-safety durable-store gate
        run: cargo test --locked -p ucr-storage-sqlite

      - name: Durable production-runtime unit gate
        run: cargo test --locked -p ucr-runtime

      - name: Production-runtime operator smoke and telemetry privacy
        run: |
          set -euo pipefail
          mkdir -p dist/phase45
          cargo build --locked --profile production -p ucr-runtime
          runtime=target/production/ucr-runtime
          database="$RUNNER_TEMP/ucr-phase45-runtime.sqlite"
          init_out="$RUNNER_TEMP/ucr-phase45-init.txt"
          check_out="$RUNNER_TEMP/ucr-phase45-check.txt"
          metrics_out="$RUNNER_TEMP/ucr-phase45-metrics.txt"

          "$runtime" init --database "$database" >"$init_out"
          "$runtime" check --database "$database" >"$check_out"
          "$runtime" metrics --database "$database" >"$metrics_out"

          webhook_out="$RUNNER_TEMP/ucr-phase45-webhook.txt"
          if "$runtime" dispatch-webhook-once --database "$database" \
            --tenant-id phase45-tenant --subscription-id phase45-subscription >"$webhook_out" 2>&1; then
            echo 'production webhook dispatch unexpectedly accepted missing signing key' >&2
            exit 1
          fi
          grep -F 'UCR_WEBHOOK_SIGNING_KEY_HEX is required for dispatch-webhook-once' "$webhook_out"

          grep -F 'UCR_RUNTIME_INITIALIZED' "$init_out"
          grep -F 'UCR_RUNTIME_CHECK_OK' "$check_out"
          grep -F '"runtime_mode":"local-daemon"' "$check_out"
          grep -F '"storage_health":"healthy"' "$check_out"
          grep -F 'ucr_runtime_up 1' "$metrics_out"
          grep -F 'ucr_storage_schema_version' "$metrics_out"
          grep -F 'ucr_storage_healthy 1' "$metrics_out"

          if cat "$init_out" "$check_out" "$metrics_out" "$webhook_out" | grep -Eiq 'credential|secret|private[_ -]?key|recovery[_ -]?secret|plaintext|message[_ -]?payload'; then
            echo 'production observability leaked a forbidden sensitive-data marker' >&2
            exit 1
          fi

          if "$runtime" serve --database "$database" --bind 0.0.0.0:50051; then
            echo 'production local-daemon accepted a remote plaintext bind' >&2
            exit 1
          fi

          sha256sum "$runtime" > dist/phase45/ucr-runtime.sha256

      - name: Fixed production-profile performance gate
        env:
          UCR_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo test --locked --profile production -p ucr-conference \
            --test reference thousand_person_sfu_conference_fits_bounded_call_ceiling --no-run
          python3 tools/performance_gate.py \
            --output dist/phase45/performance-evidence.json \
            --source-commit "$UCR_SOURCE_COMMIT"

      - name: Candidate critical Chaos gate
        run: cargo test --manifest-path crates/ucr-chaos-lab/Cargo.toml --locked

      - name: Validate common conformance matrix
        run: python3 sdk/conformance/validate.py

      - name: Python conformance host probe
        run: PYTHONPATH=sdk/python python3 sdk/python/phase41_conformance.py

      - name: TypeScript conformance host probe
        run: node --experimental-strip-types sdk/typescript/phase41_conformance.ts

      - name: Kotlin conformance host probe
        run: |
          kotlinc \
            sdk/kotlin/src/main/kotlin/org/ucr/sdk/ServiceCredential.kt \
            sdk/kotlin/src/test/kotlin/org/ucr/sdk/Phase41Conformance.kt \
            -include-runtime -d /tmp/ucr-phase45-kotlin.jar
          java -jar /tmp/ucr-phase45-kotlin.jar

      - name: Swift conformance host probe
        run: |
          swiftc \
            sdk/swift/Sources/UCRSDK/ServiceCredential.swift \
            sdk/swift/Tests/main.swift \
            -o /tmp/ucr-phase45-swift
          /tmp/ucr-phase45-swift

      - name: Rust SDK conformance host probe
        run: cargo test --manifest-path crates/ucr-sdk/Cargo.toml --locked --test phase41_conformance

      - name: Compile canonical public contract
        run: protoc --proto_path=proto --descriptor_set_out=/tmp/ucr-phase45.pb proto/ucr/v1/*.proto

      - name: Build release-like workspace candidate
        run: cargo build --locked --workspace --profile staging

      - name: Emit exact candidate and production-attempt evidence
        env:
          UCR_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def passed(evidence: str) -> dict[str, str]:
              return {"status": "pass", "evidence": evidence}

          def pending() -> dict[str, str]:
              return {"status": "not-run", "evidence": ""}

          gates = {
              "security": passed("ucr-security-tests on exact commit; repository security-audit remains an independent CI check"),
              "data_safety": passed("ucr-storage-sqlite durable regression suite plus canonical Chaos Lab on exact commit"),
              "compatibility": passed("Phase-41 common matrix and all five SDK host probes on exact commit"),
              "conformance": passed("Python/TypeScript/Kotlin/Swift/Rust Phase-41 conformance probes on exact commit"),
              "critical_chaos": passed("ucr-chaos-lab complete locked test suite on exact commit"),
              "public_contract": passed("canonical protobuf descriptor compilation plus SDK conformance on exact commit"),
              "performance": passed("fixed 1000-participant production-profile gate; see performance-evidence.json"),
              "metrics": passed("production-profile ucr-runtime emitted bounded metadata-only Prometheus metrics"),
              "diagnostics": passed("production-profile ucr-runtime opened exact SQLite schema and emitted health diagnostics"),
              "telemetry_privacy": passed("operator smoke rejected sensitive-data markers in runtime diagnostics/metrics outputs"),
              "production_runtime": passed("dedicated SQLite local-daemon runtime unit + production-profile init/check/metrics + remote-bind rejection smoke"),
              "platform_signing": pending(),
          }
          candidate = {
              "schema": "ucr.production-readiness.v1",
              "source_commit": os.environ["UCR_SOURCE_COMMIT"],
              "build_profile": "staging",
              "maturity_claim": "candidate",
              "gates": gates,
          }
          production_attempt = json.loads(json.dumps(candidate))
          production_attempt["build_profile"] = "production"
          production_attempt["maturity_claim"] = "production"

          out = Path("dist/phase45")
          out.mkdir(parents=True, exist_ok=True)
          (out / "candidate-evidence.json").write_text(
              json.dumps(candidate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "production-attempt-evidence.json").write_text(
              json.dumps(production_attempt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Fail closed on candidate evidence
        run: python3 tools/production_readiness.py validate --mode candidate --evidence dist/phase45/candidate-evidence.json

      - name: Prove missing platform signing blocks Production
        run: |
          if python3 tools/production_readiness.py validate --mode production --evidence dist/phase45/production-attempt-evidence.json; then
            echo "unsigned production attempt was incorrectly accepted" >&2
            exit 1
          fi
