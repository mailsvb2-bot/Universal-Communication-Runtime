name: E2EE Bridge Refresh

on:
  push:
    branches: [webrtc-e2ee-sfu-bridge]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2ee-bridge-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format workspace
        run: cargo fmt --all
      - name: Refresh workspace lock
        run: cargo generate-lockfile
      - name: Commit deterministic refresh
        run: |
          set -euo pipefail
          git add Cargo.lock crates/ucr-webrtc
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: format and lock E2EE bridge"
            git push
          fi
      - name: Check WebRTC crate
        run: cargo check -p ucr-webrtc --locked
