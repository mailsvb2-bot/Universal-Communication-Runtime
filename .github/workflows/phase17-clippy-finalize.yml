name: Phase17 Clippy Finalize

on:
  push:
    branches: [phase17-chat]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase17-clippy-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: phase17-chat
      - name: Refactor transcript accounting helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("crates/ucr-chat/src/lib.rs")
          text = p.read_text()
          start = text.index("fn transcript_message_semantic_bytes(message: &MessageEnvelope) -> usize {")
          end = text.index("fn require_exact_subject_scope(", start)
          replacement = r'''fn transcript_message_semantic_bytes(message: &MessageEnvelope) -> usize {
    TRANSCRIPT_MESSAGE_FIXED_OVERHEAD_BYTES
        .saturating_add(transcript_message_identity_bytes(message))
        .saturating_add(message.content.len())
        .saturating_add(transcript_message_relation_bytes(message))
        .saturating_add(transcript_message_crypto_origin_bytes(message))
        .saturating_add(transcript_message_correlation_extension_bytes(message))
        .saturating_add(transcript_message_signature_bytes(message))
}

fn transcript_message_identity_bytes(message: &MessageEnvelope) -> usize {
    message
        .message_id
        .as_opaque()
        .as_wire_bytes()
        .len()
        .saturating_add(message.scope.tenant_id.as_opaque().as_wire_bytes().len())
        .saturating_add(
            message
                .scope
                .namespace_id
                .as_ref()
                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),
        )
        .saturating_add(
            message
                .conversation
                .conversation_id
                .as_opaque()
                .as_wire_bytes()
                .len(),
        )
        .saturating_add(message.author.actor_id.as_opaque().as_wire_bytes().len())
        .saturating_add(
            message
                .author
                .on_behalf_of
                .as_ref()
                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),
        )
        .saturating_add(
            message
                .author_device
                .device_id
                .as_opaque()
                .as_wire_bytes()
                .len(),
        )
        .saturating_add(
            message
                .author_device
                .identity_id
                .as_opaque()
                .as_wire_bytes()
                .len(),
        )
}

fn transcript_message_relation_bytes(message: &MessageEnvelope) -> usize {
    message
        .attachment_ids
        .iter()
        .map(|id| id.as_opaque().as_wire_bytes().len())
        .sum::<usize>()
        .saturating_add(
            message
                .reply_to
                .as_ref()
                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),
        )
        .saturating_add(
            message
                .relations
                .iter()
                .map(|relation| relation.target_message_id.as_opaque().as_wire_bytes().len())
                .sum::<usize>(),
        )
}

fn transcript_message_crypto_origin_bytes(message: &MessageEnvelope) -> usize {
    let crypto_bytes = message.crypto_metadata.as_ref().map_or(0, |metadata| {
        metadata
            .key_id
            .as_ref()
            .map_or(0, |id| id.as_opaque().as_wire_bytes().len())
            .saturating_add(metadata.opaque_metadata.len())
    });

    crypto_bytes
        .saturating_add(
            message
                .origin
                .principal_id
                .as_ref()
                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),
        )
        .saturating_add(
            message
                .origin
                .endpoint_id
                .as_ref()
                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),
        )
        .saturating_add(
            message
                .origin
                .integration_id
                .as_ref()
                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),
        )
}

fn transcript_message_correlation_extension_bytes(message: &MessageEnvelope) -> usize {
    message
        .correlation
        .correlation_id
        .as_wire_bytes()
        .len()
        .saturating_add(
            message
                .correlation
                .causation_id
                .as_ref()
                .map_or(0, |id| id.as_wire_bytes().len()),
        )
        .saturating_add(
            message
                .correlation
                .idempotency_key
                .as_ref()
                .map_or(0, String::len),
        )
        .saturating_add(
            message
                .extensions
                .iter()
                .map(|extension| extension.name.len().saturating_add(extension.payload.len()))
                .sum::<usize>(),
        )
        .saturating_add(
            message
                .external_mappings
                .iter()
                .map(|mapping| {
                    mapping
                        .integration_id
                        .as_opaque()
                        .as_wire_bytes()
                        .len()
                        .saturating_add(mapping.external_message_id.len())
                })
                .sum::<usize>(),
        )
}

fn transcript_message_signature_bytes(message: &MessageEnvelope) -> usize {
    message.signature.as_ref().map_or(0, |signature| {
        signature
            .key_id
            .as_opaque()
            .as_wire_bytes()
            .len()
            .saturating_add(signature.algorithm_id.len())
            .saturating_add(signature.signature.len())
    })
}

'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Canonical formatting
        run: cargo fmt --all
      - name: Focused lint and Phase 17 tests
        run: |
          cargo clippy -p ucr-chat --all-targets --locked -- -D warnings
          cargo test -p ucr-chat --all-targets --locked
          cargo test -p ucr-architecture-tests --test phase17_chat --locked
      - name: Commit tested refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucr-chat/src/lib.rs
          git commit -m "Refactor transcript accounting helper [phase17-clippy-finalized]"
          git push origin HEAD:phase17-chat
