name: Phase17 Transcript Finalize

on:
  push:
    branches: [phase17-chat]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase17-transcript-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: phase17-chat
      - name: Apply aggregate transcript byte budget
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "crates/ucr-chat/src/lib.rs",
              "use ucr_protocol::{CanonicalError, CanonicalErrorCode, MESSAGE_WRITE_PERMISSION};\n\npub const MAX_TRANSCRIPT_BATCH_ITEMS: usize = 256;\n",
              "use ucr_protocol::{\n    CanonicalError, CanonicalErrorCode, DEFAULT_MAX_PAYLOAD_LEN, MESSAGE_WRITE_PERMISSION,\n};\n\npub const MAX_TRANSCRIPT_BATCH_ITEMS: usize = 256;\n/// Aggregate semantic-memory budget for one transcript projection.\n///\n/// The budget is intentionally independent from item count: two maximum-size canonical text\n/// payloads already consume the full payload allowance before envelope metadata is counted.\npub const MAX_TRANSCRIPT_BATCH_BYTES: usize = 2 * DEFAULT_MAX_PAYLOAD_LEN as usize;\nconst TRANSCRIPT_MESSAGE_FIXED_OVERHEAD_BYTES: usize = 64;\n",
          )

          replace(
              "crates/ucr-chat/src/lib.rs",
              "    TranscriptBatchSize,\n    NotFound,\n",
              "    TranscriptBatchSize,\n    TranscriptBatchBytes,\n    NotFound,\n",
          )

          replace(
              "crates/ucr-chat/src/lib.rs",
              "    /// Rejects empty/oversized batches, cross-scope/cross-conversation Messages, or read failures.\n",
              "    /// Rejects empty/oversized item batches, aggregate semantic-byte budget exhaustion,\n    /// cross-scope/cross-conversation Messages, or read failures.\n",
          )

          replace(
              "crates/ucr-chat/src/lib.rs",
              """        let unique_ids = message_ids.iter().cloned().collect::<BTreeSet<_>>();\n        let runtime = AuthorizedDurableRuntime::new(self.authorization, self.store);\n        let mut messages = Vec::with_capacity(unique_ids.len());\n        for message_id in unique_ids {\n            let message = runtime\n                .message(subject, scope, &message_id)?\n                .ok_or(ChatError::NotFound)?;\n            require_direct_message(&message)?;\n            if message.conversation.conversation_id != *conversation_id {\n                return Err(ChatError::MessageOutsideConversation);\n            }\n            messages.push(message);\n        }\n""",
              """        let unique_ids = message_ids.iter().cloned().collect::<BTreeSet<_>>();\n        let runtime = AuthorizedDurableRuntime::new(self.authorization, self.store);\n        let mut messages = Vec::with_capacity(unique_ids.len());\n        let mut transcript_bytes = 0_usize;\n        for message_id in unique_ids {\n            let message = runtime\n                .message(subject, scope, &message_id)?\n                .ok_or(ChatError::NotFound)?;\n            require_direct_message(&message)?;\n            if message.conversation.conversation_id != *conversation_id {\n                return Err(ChatError::MessageOutsideConversation);\n            }\n            transcript_bytes = transcript_bytes\n                .checked_add(transcript_message_semantic_bytes(&message))\n                .ok_or(ChatError::TranscriptBatchBytes)?;\n            if transcript_bytes > MAX_TRANSCRIPT_BATCH_BYTES {\n                return Err(ChatError::TranscriptBatchBytes);\n            }\n            messages.push(message);\n        }\n""",
          )

          replace(
              "crates/ucr-chat/src/lib.rs",
              """fn require_exact_subject_scope(\n    subject: &ScopedPrincipal,\n    scope: &TenantScope,\n) -> Result<(), ChatError> {\n""",
              """fn transcript_message_semantic_bytes(message: &MessageEnvelope) -> usize {\n    let mut bytes = TRANSCRIPT_MESSAGE_FIXED_OVERHEAD_BYTES\n        .saturating_add(message.message_id.as_opaque().as_wire_bytes().len())\n        .saturating_add(message.scope.tenant_id.as_opaque().as_wire_bytes().len())\n        .saturating_add(\n            message\n                .scope\n                .namespace_id\n                .as_ref()\n                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),\n        )\n        .saturating_add(\n            message\n                .conversation\n                .conversation_id\n                .as_opaque()\n                .as_wire_bytes()\n                .len(),\n        )\n        .saturating_add(message.author.actor_id.as_opaque().as_wire_bytes().len())\n        .saturating_add(\n            message\n                .author\n                .on_behalf_of\n                .as_ref()\n                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),\n        )\n        .saturating_add(\n            message\n                .author_device\n                .device_id\n                .as_opaque()\n                .as_wire_bytes()\n                .len(),\n        )\n        .saturating_add(\n            message\n                .author_device\n                .identity_id\n                .as_opaque()\n                .as_wire_bytes()\n                .len(),\n        )\n        .saturating_add(message.content.len())\n        .saturating_add(\n            message\n                .attachment_ids\n                .iter()\n                .map(|id| id.as_opaque().as_wire_bytes().len())\n                .sum::<usize>(),\n        )\n        .saturating_add(\n            message\n                .reply_to\n                .as_ref()\n                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),\n        )\n        .saturating_add(\n            message\n                .relations\n                .iter()\n                .map(|relation| relation.target_message_id.as_opaque().as_wire_bytes().len())\n                .sum::<usize>(),\n        );\n\n    if let Some(metadata) = &message.crypto_metadata {\n        bytes = bytes\n            .saturating_add(\n                metadata\n                    .key_id\n                    .as_ref()\n                    .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),\n            )\n            .saturating_add(metadata.opaque_metadata.len());\n    }\n\n    bytes = bytes\n        .saturating_add(\n            message\n                .origin\n                .principal_id\n                .as_ref()\n                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),\n        )\n        .saturating_add(\n            message\n                .origin\n                .endpoint_id\n                .as_ref()\n                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),\n        )\n        .saturating_add(\n            message\n                .origin\n                .integration_id\n                .as_ref()\n                .map_or(0, |id| id.as_opaque().as_wire_bytes().len()),\n        )\n        .saturating_add(message.correlation.correlation_id.as_wire_bytes().len())\n        .saturating_add(\n            message\n                .correlation\n                .causation_id\n                .as_ref()\n                .map_or(0, |id| id.as_wire_bytes().len()),\n        )\n        .saturating_add(\n            message\n                .correlation\n                .idempotency_key\n                .as_ref()\n                .map_or(0, String::len),\n        )\n        .saturating_add(\n            message\n                .extensions\n                .iter()\n                .map(|extension| extension.name.len().saturating_add(extension.payload.len()))\n                .sum::<usize>(),\n        )\n        .saturating_add(\n            message\n                .external_mappings\n                .iter()\n                .map(|mapping| {\n                    mapping\n                        .integration_id\n                        .as_opaque()\n                        .as_wire_bytes()\n                        .len()\n                        .saturating_add(mapping.external_message_id.len())\n                })\n                .sum::<usize>(),\n        );\n\n    if let Some(signature) = &message.signature {\n        bytes = bytes\n            .saturating_add(signature.key_id.as_opaque().as_wire_bytes().len())\n            .saturating_add(signature.algorithm_id.len())\n            .saturating_add(signature.signature.len());\n    }\n\n    bytes\n}\n\nfn require_exact_subject_scope(\n    subject: &ScopedPrincipal,\n    scope: &TenantScope,\n) -> Result<(), ChatError> {\n""",
          )

          replace(
              "crates/ucr-chat/tests/reference.rs",
              """use ucr_chat::{\n    ChatClock, ChatClockError, ChatError, ChatRuntime, EphemeralChatError, EphemeralChatSink,\n    TypingState, TypingUpdate,\n};\n""",
              """use ucr_chat::{\n    ChatClock, ChatClockError, ChatError, ChatRuntime, EphemeralChatError, EphemeralChatSink,\n    MAX_TRANSCRIPT_BATCH_BYTES, TypingState, TypingUpdate,\n};\n""",
          )
          replace(
              "crates/ucr-chat/tests/reference.rs",
              "use ucr_protocol::{CanonicalError, CanonicalErrorCode, DELIVERY_WRITE_PERMISSION};\n",
              "use ucr_protocol::{\n    CanonicalError, CanonicalErrorCode, DEFAULT_MAX_PAYLOAD_LEN, DELIVERY_WRITE_PERMISSION,\n};\n",
          )

          marker = """#[test]\nfn phase17_rejects_group_conversation_instead_of_implementing_phase18_implicitly() {\n"""
          test = """#[test]\nfn transcript_enforces_aggregate_semantic_byte_budget() {\n    let store = MemoryLocalStore::default();\n    let authorization = AllowAll;\n    let sink = RecordingSink::default();\n    let clock = FixedClock(10_000);\n    let chat = ChatRuntime::new(&clock, &authorization, &store, &sink);\n    let direct = conversation(ConversationKind::Direct);\n    chat.open_direct_chat(&subject(), &direct)\n        .expect(\"open direct chat\");\n\n    assert_eq!(\n        MAX_TRANSCRIPT_BATCH_BYTES,\n        2 * DEFAULT_MAX_PAYLOAD_LEN as usize\n    );\n    let first = message(\n        \"message-byte-budget-a\",\n        10,\n        &vec![b'a'; DEFAULT_MAX_PAYLOAD_LEN as usize],\n    );\n    let second = message(\n        \"message-byte-budget-b\",\n        20,\n        &vec![b'b'; DEFAULT_MAX_PAYLOAD_LEN as usize],\n    );\n    chat.send_text(&subject(), &first).expect(\"persist first\");\n    chat.send_text(&subject(), &second).expect(\"persist second\");\n\n    assert_eq!(\n        chat.load_transcript_batch(\n            &subject(),\n            &scope(),\n            &direct.conversation.conversation_id,\n            &[first.message_id.clone(), second.message_id.clone()],\n        ),\n        Err(ChatError::TranscriptBatchBytes)\n    );\n}\n\n"""
          p = Path("crates/ucr-chat/tests/reference.rs")
          text = p.read_text()
          if marker not in text:
              raise SystemExit("missing reference test insertion marker")
          p.write_text(text.replace(marker, test + marker, 1))

          replace(
              "spec/chat.md",
              "Phase 17 does not add a parallel timeline index. `load_transcript_batch` accepts a bounded list of canonical Message IDs, reads those Messages through the existing authorized Message owner, rejects cross-conversation material, and produces a deterministic projection. Message IDs may come from existing Event, Sync, integration, or future canonical query surfaces.\n",
              "Phase 17 does not add a parallel timeline index. `load_transcript_batch` accepts a bounded list of canonical Message IDs, reads those Messages through the existing authorized Message owner, rejects cross-conversation material, and produces a deterministic projection. The projection is bounded both by `MAX_TRANSCRIPT_BATCH_ITEMS` and by `MAX_TRANSCRIPT_BATCH_BYTES`; the aggregate byte budget counts Message content plus variable envelope material such as IDs, relations, crypto metadata, extensions, external mappings, correlation data, and signatures so item-count limits cannot be bypassed through large canonical Messages. Message IDs may come from existing Event, Sync, integration, or future canonical query surfaces.\n",
          )
          PY
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Canonical formatting
        run: cargo fmt --all
      - name: Focused Phase 17 verification
        run: cargo test -p ucr-chat --all-targets --locked && cargo test -p ucr-architecture-tests --test phase17_chat --locked
      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ucr-chat/src/lib.rs crates/ucr-chat/tests/reference.rs spec/chat.md
          git commit -m "Bound Phase 17 transcript bytes [phase17-transcript-finalized]"
          git push origin HEAD:phase17-chat
