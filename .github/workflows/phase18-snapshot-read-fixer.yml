name: Phase18 Snapshot Read Fix Verifier

on:
  push:
    branches: [phase18-groups]
    paths:
      - .github/workflows/phase18-snapshot-read-fixer.yml
      - .github/phase18_snapshot_read_fix.py

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply, verify, and commit snapshot-read fix when fixer exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/phase18_snapshot_read_fix.py ]; then
            echo "Fixer removed; cleanup push is intentionally a no-op."
            exit 0
          fi
          python3 .github/phase18_snapshot_read_fix.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test -p ucr-architecture-tests --release --locked
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/ucr-core/src/group.rs \
            crates/ucr-core/src/authorized_runtime.rs \
            crates/ucr-storage-memory/src/group_store.rs \
            crates/ucr-storage-sqlite/src/group_store.rs \
            crates/ucr-architecture-tests/tests/phase18_groups.rs \
            spec/groups.md \
            docs/adr/0056-phase18-groups-reuse-canonical-conversation-message-and-authorization-owners.md
          git commit -m "Make Group membership reads snapshot-safe"
          git push origin HEAD:phase18-groups
