name: Phase17 Mechanical Fix

on:
  push:
    branches: [phase17-chat]

permissions:
  contents: write

jobs:
  format-and-lock:
    if: ${{ !contains(github.event.head_commit.message, '[phase17-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: phase17-chat
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Generate workspace lock
        run: cargo generate-lockfile
      - name: Commit mechanical changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/ucr-chat crates/ucr-architecture-tests/tests/phase17_chat.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Phase 17 format and lock [phase17-generated]"
          git push origin HEAD:phase17-chat
