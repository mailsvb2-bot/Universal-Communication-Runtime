name: One-shot canonical WebRTC dependency remediation

on:
  push:
    branches:
      - fix/first-party-mls-refresh-integrity-20261103

permissions:
  contents: write

jobs:
  resolve-webrtc-utility:
    if: "github.event.head_commit.message == 'build(webrtc): run one-shot upstream dependency repair'"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/first-party-mls-refresh-integrity-20261103
          persist-credentials: true
      - name: Select project's pinned Rust toolchain
        run: rustup show
      - name: Verify and vendor upstream crate with an exact feature-only patch
        run: python3 tools/prepare_webrtc_util_patch.py
      - name: Resolve both independent Cargo dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p webrtc-util --manifest-path Cargo.toml
          cargo update -p webrtc-util --manifest-path crates/ucr-chaos-lab/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          for filename in ("Cargo.lock", "crates/ucr-chaos-lab/Cargo.lock"):
              contents=tomllib.loads(Path(filename).read_text())
              packages=contents["package"]
              assert not [p for p in packages if p["name"]=="pin-utils"], filename
              matches=[p for p in packages if p["name"]=="webrtc-util"]
              assert len(matches)==1 and "source" not in matches[0], (filename,matches)
              assert any(d.startswith("nix") for d in matches[0]["dependencies"]), filename
              print("PASS:",filename,"no pin-utils; patched webrtc-util resolves locally")
          PY
      - name: Validate locked resolution and actual WebRTC source compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo metadata --manifest-path crates/ucr-chaos-lab/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
          cargo check -p ucr-webrtc --locked
          cargo test -p ucr-webrtc --locked --lib
          cargo check --manifest-path crates/ucr-chaos-lab/Cargo.toml --locked
      - name: Publish only source and regenerated locks on the already-reviewed PR branch
        shell: bash
        env:
          EXPECTED_BRANCH: fix/first-party-mls-refresh-integrity-20261103
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-webrtc-dependency-repair.yml
          git add Cargo.toml Cargo.lock \
            crates/ucr-chaos-lab/Cargo.toml crates/ucr-chaos-lab/Cargo.lock \
            third_party/webrtc-util-v0172
          git diff --cached --check
          git commit -m "fix(webrtc): remove transitive pin-utils via a single upstream utility feature patch"
          git push origin HEAD:refs/heads/"$EXPECTED_BRANCH"
