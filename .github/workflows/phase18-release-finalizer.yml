name: Phase18 Release Finalizer

on:
  push:
    branches: [phase18-groups]
    paths:
      - .github/workflows/phase18-release-finalizer.yml

permissions:
  contents: write

jobs:
  finalize-phase18:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: phase18-groups
      - name: Apply final Phase 18 release patch
        run: python3 .github/phase18_release_finalize.py
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check affected owners
        run: cargo check -p ucr-core -p ucr-protocol -p ucr-storage-memory -p ucr-storage-sqlite -p ucr-architecture-tests --all-targets
      - name: Strict Clippy affected owners
        run: cargo clippy -p ucr-core -p ucr-protocol -p ucr-storage-memory -p ucr-storage-sqlite -p ucr-architecture-tests --all-targets -- -D warnings
      - name: SQLite Group restart and migration evidence
        run: cargo test -p ucr-storage-sqlite
      - name: Phase 17 and 18 architecture gates
        run: cargo test -p ucr-architecture-tests --test phase17_chat --test phase18_groups
      - name: Repository guard syntax
        run: |
          test -s spec/groups.md
          test -s docs/adr/0056-phase18-groups-reuse-canonical-conversation-message-and-authorization-owners.md
          grep -F 'test -s spec/groups.md' .github/workflows/ci.yml
          grep -F '0056-phase18-groups-reuse-canonical-conversation-message-and-authorization-owners.md' .github/workflows/ci.yml
          grep -F '**Phase 18 — Groups (Prepared/reference complete; Phase 19 not started).**' README.md
      - name: Commit verified Phase 18 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/phase18_release_finalize.py .github/workflows/phase18-release-finalizer.yml
          git add README.md .github/workflows/ci.yml crates/ucr-storage-sqlite/src/group_store.rs
          git commit -m "Close Phase 18 Groups implementation and release gates"
          git push origin HEAD:phase18-groups
