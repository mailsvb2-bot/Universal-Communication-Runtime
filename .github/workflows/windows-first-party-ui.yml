name: Windows First-Party UI Contract
on:
  pull_request:
    paths:
      - 'crates/ucr-realtime-web/static/start.html'
      - 'crates/ucr-realtime-web/static/start.js'
      - 'tools/check_first_party_start_controls.py'
      - 'tools/test_first_party_call_resume.mjs'
      - 'tools/check_first_party_call_revision_contract.py'
      - 'tools/check_first_party_media_admission_contract.py'
      - 'crates/ucr-realtime-web/static/client.html'
      - 'sdk/typescript/src/reference_browser_media_installer.ts'
      - 'sdk/typescript/src/canonical_browser_media_factory.ts'
      - 'sdk/typescript/src/contact_call_journey.ts'
      - 'scripts/windows/start-local-first-party-https.ps1'
      - '.github/workflows/windows-first-party-ui.yml'
  workflow_dispatch:
jobs:
  first-party-ui-controls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check JavaScript parses
        shell: pwsh
        run: node --check crates/ucr-realtime-web/static/start.js
      - name: Check page control bindings
        shell: pwsh
        run: python tools/check_first_party_start_controls.py
      - name: Exercise canonical Call reload recovery
        shell: pwsh
        run: node tools/test_first_party_call_resume.mjs
      - name: Check call creation revision contract
        shell: pwsh
        run: python tools/check_first_party_call_revision_contract.py
      - name: Check canonical media admission boundary
        shell: pwsh
        run: python tools/check_first_party_media_admission_contract.py
