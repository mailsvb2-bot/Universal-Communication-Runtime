name: Browser Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-browser-smoke:
    name: desktop-${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            browser: chrome
          - runner: ubuntu-24.04
            browser: edge
          - runner: ubuntu-24.04
            browser: firefox
          - runner: macos-15
            browser: safari
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install browser WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build endpoint WASM browser package
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ucr-endpoint-wasm-target"
          cargo build             --manifest-path crates/ucr-endpoint-wasm/Cargo.toml             --target wasm32-unknown-unknown             --release
          mkdir -p crates/ucr-realtime-web/static/endpoint-wasm
          wasm-bindgen             "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ucr_endpoint_wasm.wasm"             --target web             --out-dir crates/ucr-realtime-web/static/endpoint-wasm             --out-name ucr_endpoint_wasm
          test -s crates/ucr-realtime-web/static/endpoint-wasm/ucr_endpoint_wasm.js
          test -s crates/ucr-realtime-web/static/endpoint-wasm/ucr_endpoint_wasm_bg.wasm
      - name: Enable Safari WebDriver
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: Probe reference browser contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if python3 tools/browser_compatibility_probe.py \
              --browser "${{ matrix.browser }}" \
              --output "dist/browser-compatibility/${{ matrix.browser }}.json"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "browser compatibility probe failed twice" >&2
              exit 1
            fi
            echo "browser WebDriver probe failed during startup/session creation; retrying once" >&2
            sleep 2
          done
      - name: Upload browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ucr-browser-compatibility-${{ matrix.browser }}-${{ github.sha }}
          path: dist/browser-compatibility/${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 14
