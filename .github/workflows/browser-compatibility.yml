name: Browser Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-browser-smoke:
    name: desktop-${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            browser: chrome
          - runner: ubuntu-24.04
            browser: edge
          - runner: ubuntu-24.04
            browser: firefox
          - runner: macos-15
            browser: safari
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install browser WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if CARGO_NET_RETRY=5 cargo install wasm-bindgen-cli --version 0.2.128 --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Build endpoint WASM browser package
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ucr-endpoint-wasm-target"
          cargo build             --manifest-path crates/ucr-endpoint-wasm/Cargo.toml             --target wasm32-unknown-unknown             --release
          mkdir -p crates/ucr-realtime-web/static/endpoint-wasm
          wasm-bindgen             "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ucr_endpoint_wasm.wasm"             --target web             --out-dir crates/ucr-realtime-web/static/endpoint-wasm             --out-name ucr_endpoint_wasm
          test -s crates/ucr-realtime-web/static/endpoint-wasm/ucr_endpoint_wasm.js
          test -s crates/ucr-realtime-web/static/endpoint-wasm/ucr_endpoint_wasm_bg.wasm
      - name: Enable Safari WebDriver
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - name: Probe reference browser contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if python3 tools/browser_compatibility_probe.py \
              --browser "${{ matrix.browser }}" \
              --output "dist/browser-compatibility/${{ matrix.browser }}.json"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "browser compatibility probe failed twice" >&2
              exit 1
            fi
            echo "browser WebDriver probe failed during startup/session creation; retrying once" >&2
            sleep 2
          done
      - name: Upload browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ucr-browser-compatibility-${{ matrix.browser }}-${{ github.sha }}
          path: dist/browser-compatibility/${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 14


  android-chrome:
    name: mobile-android-chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install browser WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if CARGO_NET_RETRY=5 cargo install wasm-bindgen-cli --version 0.2.128 --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Build endpoint WASM browser package
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ucr-endpoint-wasm-target"
          cargo build \
            --manifest-path crates/ucr-endpoint-wasm/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release
          mkdir -p crates/ucr-realtime-web/static/endpoint-wasm
          wasm-bindgen \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ucr_endpoint_wasm.wasm" \
            --target web \
            --out-dir crates/ucr-realtime-web/static/endpoint-wasm \
            --out-name ucr_endpoint_wasm
          test -s crates/ucr-realtime-web/static/endpoint-wasm/ucr_endpoint_wasm.js
          test -s crates/ucr-realtime-web/static/endpoint-wasm/ucr_endpoint_wasm_bg.wasm
      - name: Boot Android emulator with Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis_playstore;x86_64"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/adbkey" ]; then
            adb keygen "$HOME/.android/adbkey" >/dev/null
          fi
          export ADB_VENDOR_KEYS="$HOME/.android"
          echo "ADB_VENDOR_KEYS=$HOME/.android" >> "$GITHUB_ENV"
          adb kill-server >/dev/null 2>&1 || true
          adb start-server

          AVD_DIR="$HOME/.android/avd/ucr-mobile.avd"
          mkdir -p "$AVD_DIR"
          cat >"$HOME/.android/avd/ucr-mobile.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_DIR
          path.rel=avd/ucr-mobile.avd
          target=android-34
          EOF
          cat >"$AVD_DIR/config.ini" <<'EOF'
          AvdId=ucr-mobile
          PlayStore.enabled=true
          abi.type=x86_64
          avd.ini.displayname=UCR Mobile
          disk.dataPartition.size=4G
          fastboot.forceColdBoot=yes
          hw.audioInput=no
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=2400
          hw.lcd.width=1080
          hw.ramSize=2048
          image.sysdir.1=system-images/android-34/google_apis_playstore/x86_64/
          runtime.network.latency=none
          runtime.network.speed=full
          tag.display=Google Play
          tag.id=google_apis_playstore
          vm.heapSize=384
          EOF

          sudo chmod 666 /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd ucr-mobile \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/ucr-android-emulator.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/ucr-android-emulator.pid"

          if ! timeout 180s adb wait-for-device; then
            cat "$RUNNER_TEMP/ucr-android-emulator.log" >&2
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/ucr-android-emulator.log" >&2
            exit 1
          fi

          adb shell settings put global device_provisioned 1
          adb shell settings put secure user_setup_complete 1
          adb shell pm enable com.android.chrome >/dev/null 2>&1 || true
          adb shell pm path com.android.chrome
          adb shell 'echo "chrome --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line'
          adb reverse tcp:8765 tcp:8765
      - name: Probe Android Chrome on emulator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android_chrome_probe_runner.py \
            --port 8765 \
            --output dist/browser-compatibility/android-chrome.json \
            --probe-timeout-seconds 300 \
            --navigation-attempts 4 \
            --evidence-wait-seconds 40
      - name: Upload Android Chrome evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ucr-browser-compatibility-android-chrome-${{ github.sha }}
          path: dist/browser-compatibility/android-chrome.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop Android emulator
        if: always()
        shell: bash
        run: adb emu kill >/dev/null 2>&1 || true

  ios-safari-attempts:
    name: mobile-ios-safari-attempt-${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Verify pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --find simctl
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install browser WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if CARGO_NET_RETRY=5 cargo install wasm-bindgen-cli --version 0.2.128 --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Build endpoint WASM browser package
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/ucr-endpoint-wasm-target"
          cargo build \
            --manifest-path crates/ucr-endpoint-wasm/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release
          mkdir -p crates/ucr-realtime-web/static/endpoint-wasm
          wasm-bindgen \
            "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ucr_endpoint_wasm.wasm" \
            --target web \
            --out-dir crates/ucr-realtime-web/static/endpoint-wasm \
            --out-name ucr_endpoint_wasm
          test -s crates/ucr-realtime-web/static/endpoint-wasm/ucr_endpoint_wasm.js
          test -s crates/ucr-realtime-web/static/endpoint-wasm/ucr_endpoint_wasm_bg.wasm
      - name: Probe iOS Safari on Simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ios_safari_probe_runner.py \
            --port 8765 \
            --output dist/browser-compatibility/ios-safari-${{ matrix.runner }}.json \
            --probe-timeout-seconds 210 \
            --openurl-timeout-seconds 15 \
            --open-attempts 4 \
            --max-simulators 2
      - name: Upload iOS Safari attempt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ucr-browser-compatibility-ios-safari-attempt-${{ matrix.runner }}-${{ github.sha }}
          path: dist/browser-compatibility/ios-safari-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop iOS Simulators
        if: always()
        shell: bash
        run: xcrun simctl shutdown all >/dev/null 2>&1 || true

  ios-safari:
    name: mobile-ios-safari
    needs: ios-safari-attempts
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download successful iOS Safari evidence attempts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ucr-browser-compatibility-ios-safari-attempt-*-${{ github.sha }}
          path: dist/browser-compatibility/ios-safari-attempts
          merge-multiple: true
      - name: Require at least one valid real iOS Safari evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("dist/browser-compatibility/ios-safari-attempts")
          files = sorted(root.rglob("*.json")) if root.exists() else []
          valid = []
          errors = []
          for path in files:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception as error:
                  errors.append(f"{path}: invalid JSON: {error}")
                  continue
              if payload.get("schema") != "ucr.mobile-browser-compatibility.v1":
                  errors.append(f"{path}: wrong schema")
                  continue
              if payload.get("browser_requested") != "ios-safari":
                  errors.append(f"{path}: wrong browser_requested")
                  continue
              if payload.get("evidence_kind") != "real-ios-simulator-safari-self-probe":
                  errors.append(f"{path}: wrong evidence_kind")
                  continue
              if payload.get("passed") is not True:
                  errors.append(f"{path}: passed is not true")
                  continue
              probe = payload.get("probe")
              if not isinstance(probe, dict) or probe.get("passed") is not True:
                  errors.append(f"{path}: nested probe did not pass")
                  continue
              valid.append(path)

          if not valid:
              detail = " | ".join(errors) if errors else "no evidence artifacts downloaded"
              raise SystemExit(
                  "no successful real iOS Safari simulator evidence: " + detail
              )

          print("validated iOS Safari evidence: " + ", ".join(map(str, valid)))
          PY
      - name: Publish canonical iOS Safari evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ucr-browser-compatibility-ios-safari-${{ github.sha }}
          path: dist/browser-compatibility/ios-safari-attempts/*.json
          if-no-files-found: error
          retention-days: 14
