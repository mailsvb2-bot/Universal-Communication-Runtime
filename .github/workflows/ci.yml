          test -s docs/adr/0059-phase21-video-reuses-canonical-call-and-capability-owners.md &&
          test -s docs/adr/0060-phase22-e2ee-media-reuses-canonical-call-crypto-and-capability-owners.md &&
          test -s docs/adr/0061-phase23-adaptive-media-reuses-canonical-media-and-security-owners.md &&
          test -s docs/adr/0062-phase24-transport-orchestrator-reuses-canonical-intent-endpoint-policy-and-transport-owners.md &&
          test -s docs/adr/0063-phase25-automatic-failover-reuses-transport-orchestrator-and-provider-acceptance-evidence.md &&
          test -s docs/adr/0064-phase26-offline-groups-reuses-group-message-sync-and-trust-owners.md &&
          test -s docs/adr/0065-phase27-store-and-forward-reuses-intent-message-delivery-and-transport-owners.md
