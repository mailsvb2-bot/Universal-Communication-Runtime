name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked

  repository-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Canon provenance exists
        run: test -s docs/canon/SOURCE.md
      - name: Protocol specification exists
        run: test -s spec/protocol.md
      - name: Public contract exists
        run: test -s proto/ucr/v1/runtime.proto
      - name: ADR governance exists
        run: test -s docs/adr/0000-template.md
