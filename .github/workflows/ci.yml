          test -s docs/adr/0050-phase13-grpc-identity-bindings-reuse-canonical-owners.md &&
          test -s docs/adr/0051-phase13-grpc-completes-integration-service-over-canonical-owners.md &&
          test -s docs/adr/0052-phase14-event-api-reuses-append-only-journal-with-durable-consumer-state.md &&
          test -s docs/adr/0053-phase15-internet-transport-reuses-canonical-transport-and-crypto-owners.md &&
          test -s docs/adr/0054-phase16-local-direct-transport-reuses-canonical-transport-and-crypto-owners.md &&
          test -s docs/adr/0055-phase17-chat-reuses-canonical-conversation-message-and-delivery-owners.md &&
          test -s docs/adr/0056-phase18-groups-reuse-canonical-conversation-message-and-authorization-owners.md &&
          test -s docs/adr/0057-phase19-call-signalling-reuses-canonical-conversation-identity-and-authorization-owners.md &&
