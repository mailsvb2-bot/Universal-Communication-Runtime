name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install native media build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake build-essential
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Fuzz workspace format
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Fuzz workspace check
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - name: Fuzz workspace clippy
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

  release-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install native media build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake build-essential
      - name: Release tests
        run: cargo test --workspace --all-targets --release --locked

  security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings
      - name: Audit fuzz Cargo.lock
        run: cargo audit --file fuzz/Cargo.lock --deny warnings

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-09-02 --profile minimal --component rust-src
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Bounded fuzz smoke
        run: ./fuzz/run-smoke.sh
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ucr-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install protobuf compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Compile public protobuf contract
        run: protoc --proto_path=proto --descriptor_set_out=/tmp/ucr-public.pb proto/ucr/v1/*.proto

  repository-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Canon provenance exists
        run: test -s docs/canon/SOURCE.md
      - name: Threat model exists
        run: test -s docs/architecture/THREAT_MODEL.md
      - name: Protocol specification exists
        run: >-
          test -s spec/protocol.md &&
          test -s spec/framing.md &&
          test -s spec/negotiation.md &&
          test -s spec/errors.md &&
          test -s spec/identity-addressing.md &&
          test -s spec/principal-actor-device.md &&
          test -s spec/tenant-scope.md &&
          test -s spec/permissions.md &&
          test -s spec/service-principal-authentication.md &&
          test -s spec/service-principal-control.md &&
          test -s spec/commands-events.md &&
          test -s spec/local-storage.md &&
          test -s spec/crypto.md &&
          test -s spec/recovery.md &&
          test -s spec/conversation-message.md &&
          test -s spec/delivery.md &&
          test -s spec/sync.md &&
          test -s spec/integration-api.md &&
          test -s spec/event-api.md &&
          test -s spec/internet-transport.md &&
          test -s spec/local-transport.md &&
          test -s spec/chat.md &&
          test -s spec/groups.md &&
          test -s spec/call-signalling.md &&
          test -s spec/audio.md &&
          test -s spec/video.md &&
          test -s spec/media-e2ee.md &&
          test -s spec/adaptive-media.md &&
          test -s spec/transport-orchestrator.md &&
          test -s spec/transport-failover.md &&
          test -s spec/offline-groups.md &&
          test -s spec/store-forward.md
      - name: Public contract exists
        run: >-
          test -s proto/ucr/v1/runtime.proto &&
          test -s proto/ucr/v1/communication.proto &&
          test -s proto/ucr/v1/errors.proto &&
          test -s proto/ucr/v1/identity.proto &&
          test -s proto/ucr/v1/authorization.proto &&
          test -s proto/ucr/v1/crypto.proto &&
          test -s proto/ucr/v1/recovery.proto &&
          test -s proto/ucr/v1/sync.proto &&
          test -s proto/ucr/v1/integration.proto &&
          test -s proto/ucr/v1/event_api.proto &&
          test -s proto/ucr/v1/internet_transport.proto &&
          test -s proto/ucr/v1/call.proto &&
          test -s proto/ucr/v1/audio.proto &&
          test -s proto/ucr/v1/video.proto &&
          test -s proto/ucr/v1/media_e2ee.proto &&
          test -s proto/ucr/v1/adaptive_media.proto &&
          test -s proto/ucr/v1/transport_orchestrator.proto &&
          test -s proto/ucr/v1/transport_failover.proto &&
          test -s proto/ucr/v1/offline_groups.proto &&
          test -s proto/ucr/v1/store_forward.proto
      - name: ADR governance exists
        run: >-
          test -s docs/adr/0000-template.md &&
          test -s docs/adr/0002-phase-0-wire-framing.md &&
          test -s docs/adr/0003-identity-address-endpoint-route-separation.md &&
          test -s docs/adr/0004-actor-provenance-and-device-lifecycle.md &&
          test -s docs/adr/0005-threat-model-as-release-gate.md &&
          test -s docs/adr/0006-exact-tenant-namespace-scope-by-default.md &&
          test -s docs/adr/0007-deny-by-default-explicit-permission-grants.md &&
          test -s docs/adr/0008-command-event-idempotency-semantics.md &&
          test -s docs/adr/0009-capability-specific-storage-and-sqlite-reference.md &&
          test -s docs/adr/0010-append-only-event-journal-and-terminal-command-outcomes.md &&
          test -s docs/adr/0011-versioned-crypto-suite-v1-and-non-exporting-key-operations.md &&
          test -s docs/adr/0012-recovery-is-an-explicit-trust-transition.md &&
          test -s docs/adr/0013-provider-independent-conversation-and-durable-message.md &&
          test -s docs/adr/0014-delivery-attempts-and-evidence-are-separate-from-message-identity.md &&
          test -s docs/adr/0015-sync-sessions-use-opaque-resume-checkpoints.md &&
          test -s docs/adr/0016-event-anti-entropy-uses-versioned-fingerprints-and-snapshot-cursors.md &&
          test -s docs/adr/0017-command-envelope-version-and-extensions-are-durable-idempotency-semantics.md &&
          test -s docs/adr/0018-runtime-receipts-and-generic-acknowledgements-preserve-wire-semantics.md &&
          test -s docs/adr/0019-negotiation-and-capabilities-use-one-payload-bearing-extension-model.md &&
          test -s docs/adr/0020-message-intent-and-error-wire-parity-with-message-extension-storage.md &&
          test -s docs/adr/0021-sensitive-canonical-debug-surfaces-redact-private-material.md &&
          test -s docs/adr/0022-opaque-id-bytes-have-exact-utf8-semantic-contract.md &&
          test -s docs/adr/0023-native-opaque-ids-use-os-csprng-random-hex-v1.md &&
          test -s docs/adr/0024-message-signatures-bind-canonical-authored-message.md &&
          test -s docs/adr/0025-bounded-fuzzing-is-required-for-implemented-untrusted-boundaries.md &&
          test -s docs/adr/0026-trusted-signing-keys-use-scoped-nonreactivating-lifecycle.md &&
          test -s docs/adr/0027-permission-grants-are-durable-and-runtime-enforced.md &&
          test -s docs/adr/0028-tenant-scoped-durable-runtime-operations-require-explicit-permissions.md &&
          test -s docs/adr/0029-infrastructure-metadata-visibility-is-explicit-and-machine-checked.md &&
          test -s docs/adr/0030-service-principal-credentials-authenticate-canonical-scoped-principals.md &&
          test -s docs/adr/0031-service-principal-requests-require-quota-and-append-only-audit.md &&
          test -s docs/adr/0032-device-lifecycle-is-durable-and-gates-protected-key-access.md &&
          test -s docs/adr/0033-recovery-device-staging-requires-verified-authority-and-active-plan.md &&
