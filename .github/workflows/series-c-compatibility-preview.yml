name: Series C compatibility preview (non-mutating)
on:
  push:
    branches:
      - review/ucr-series-c-20261104
permissions:
  contents: read
jobs:
  merge-preview:
    if: contains(github.event.head_commit.message, 'ci(series-c): preview canonical MLS/WebRTC integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Preview merge from current MLS/WebRTC owner; never publish a merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/fix/first-party-mls-refresh-integrity-20261103:refs/remotes/origin/fix/first-party-mls-refresh-integrity-20261103'
          if ! git merge --no-commit --no-ff origin/fix/first-party-mls-refresh-integrity-20261103; then
            echo '### Conflicting files (no branch changes published)' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### Clean test merge; no changes published' >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --name-only | tee -a "$GITHUB_STEP_SUMMARY"
          git merge --abort
