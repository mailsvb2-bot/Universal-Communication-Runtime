name: Phase17 Finalize

on:
  push:
    branches: [phase17-chat]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase17-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: phase17-chat
      - name: Apply Phase 17 final release truth
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "crates/ucr-chat/src/lib.rs",
              """        require_exact_subject_scope(subject, &update.scope)?;\n        let conversation = AuthorizedDurableRuntime::new(self.authorization, self.store)\n            .conversation(subject, &update.scope, &update.conversation_id)?\n            .ok_or(ChatError::NotFound)?;\n        require_direct_conversation(&conversation)?;\n        self.authorize_message_write(subject, &update.scope)?;\n""",
              """        require_exact_subject_scope(subject, &update.scope)?;\n        self.authorize_message_write(subject, &update.scope)?;\n        let conversation = AuthorizedDurableRuntime::new(self.authorization, self.store)\n            .conversation(subject, &update.scope, &update.conversation_id)?\n            .ok_or(ChatError::NotFound)?;\n        require_direct_conversation(&conversation)?;\n""",
          )

          replace(
              "README.md",
              "**Phase 16 — LAN / Direct Transport (Prepared/reference complete; Phase 17 Chat not started).**",
              "**Phase 17 — Chat (Prepared/reference complete; Phase 18 Groups not started).**",
          )
          replace(
              "README.md",
              "The Local capability remains Prepared; Phase 17 Chat and Phase 24 Transport Orchestrator are not started.",
              "The Local capability remains Prepared. Phase 17 now adds a Prepared direct-chat reference layer over the existing canonical Conversation, Message, Delivery and authorization owners: DIRECT conversations, durable text persistence/deduplication, bounded transcript projection through canonical Message reads, explicit READ_BY_USER evidence for Delivered -> Read, and TTL-bounded non-durable typing. It creates no second Message/Conversation/Delivery store, does not promote transport or relay acknowledgement to Read, and fails closed on cross-scope and unsupported Service Account ephemeral access. Groups/membership/moderation, attachments/file transfer, edit/delete/reaction workflows, thread lifecycle, calls, route orchestration, Reference Messenger UI and production listener deployment remain outside Phase 17. The Chat capability remains Prepared; Phase 18 Groups and Phase 24 Transport Orchestrator are not started.",
          )
          replace(
              "README.md",
              "- `crates/ucr-core/` — runtime boundary contracts; no product-specific logic.\n",
              "- `crates/ucr-core/` — runtime boundary contracts; no product-specific logic.\n- `crates/ucr-chat/` — Prepared Phase-17 direct-chat reference layer over canonical durable owners.\n",
          )

          replace(
              ".github/workflows/ci.yml",
              "          test -s spec/local-transport.md\n",
              "          test -s spec/local-transport.md &&\n          test -s spec/chat.md\n",
          )
          replace(
              ".github/workflows/ci.yml",
              "          test -s docs/adr/0054-phase16-local-direct-transport-reuses-canonical-transport-and-crypto-owners.md\n",
              "          test -s docs/adr/0054-phase16-local-direct-transport-reuses-canonical-transport-and-crypto-owners.md &&\n          test -s docs/adr/0055-phase17-chat-reuses-canonical-conversation-message-and-delivery-owners.md\n",
          )

          replace(
              "crates/ucr-architecture-tests/tests/phase16_local_transport.rs",
              """    assert!(readme.contains(\n        \"**Phase 16 — LAN / Direct Transport (Prepared/reference complete; Phase 17 Chat not started).**\"\n    ));\n    assert!(readme.contains(\"Phase 17 Chat and Phase 24 Transport Orchestrator are not started\"));\n""",
              """    assert!(readme.contains(\n        \"Phase 16 separately adds the Prepared `ucr.transport.local.tcp` / `ucr.local.tcp` LAN/direct path\"\n    ));\n""",
          )

          p = Path("crates/ucr-architecture-tests/tests/phase17_chat.rs")
          text = p.read_text()
          old = """    let adr = fs::read_to_string(workspace.join(\n        \"docs/adr/0055-phase17-chat-reuses-canonical-conversation-message-and-delivery-owners.md\",\n    ))\n    .expect(\"ADR 0055\");\n\n"""
          new = old + """    let readme = fs::read_to_string(workspace.join(\"README.md\")).expect(\"readme\");\n    let ci = fs::read_to_string(workspace.join(\".github/workflows/ci.yml\")).expect(\"ci\");\n\n"""
          if old not in text:
              raise SystemExit("missing phase17 readme/ci insertion anchor")
          text = text.replace(old, new, 1)
          old = """    assert!(adr.contains(\"second communication brain\"));\n    assert!(adr.contains(\"Phase 18 Groups remains outside this ADR\"));\n"""
          new = old + """    assert!(readme.contains(\n        \"**Phase 17 — Chat (Prepared/reference complete; Phase 18 Groups not started).**\"\n    ));\n    assert!(readme.contains(\"Phase 18 Groups and Phase 24 Transport Orchestrator are not started\"));\n    assert!(ci.contains(\"test -s spec/chat.md\"));\n    assert!(ci.contains(\n        \"0055-phase17-chat-reuses-canonical-conversation-message-and-delivery-owners.md\"\n    ));\n"""
          if old not in text:
              raise SystemExit("missing phase17 assertions insertion anchor")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Canonical formatting
        run: cargo fmt --all
      - name: Focused Phase 17 tests
        run: cargo test -p ucr-chat --all-targets --locked && cargo test -p ucr-architecture-tests --test phase16_local_transport --test phase17_chat --locked
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/ci.yml crates/ucr-chat/src/lib.rs crates/ucr-architecture-tests/tests/phase16_local_transport.rs crates/ucr-architecture-tests/tests/phase17_chat.rs
          git commit -m "Finalize Phase 17 release truth [phase17-finalized]"
          git push origin HEAD:phase17-chat
