name: Endpoint MLS Rustfmt Fix
on:
  workflow_dispatch:
  push:
    branches:
      - fix/endpoint-mls-owned-transitions-20261026
    paths:
      - crates/ucr-endpoint-wasm/src/lib.rs
      - .github/workflows/endpoint-mls-rustfmt.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'mailsvb2-bot/Universal-Communication-Runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format endpoint Rust source and push only formatted code
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ucr-endpoint-wasm/src/lib.rs
          if git diff --quiet -- crates/ucr-endpoint-wasm/src/lib.rs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/ucr-endpoint-wasm/src/lib.rs
          git commit -m "style(e2ee): rustfmt endpoint-owned MLS transitions"
          git push origin HEAD:fix/endpoint-mls-owned-transitions-20261026
