[package]
name = "ucr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
ucr-core = { path = "../crates/ucr-core" }
ucr-crypto = { path = "../crates/ucr-crypto" }
ucr-model = { path = "../crates/ucr-model" }
ucr-media-adaptive = { path = "../crates/ucr-media-adaptive" }
ucr-protocol = { path = "../crates/ucr-protocol" }
ucr-transport-internet = { path = "../crates/ucr-transport-internet", features = ["fuzzing"] }
ucr-transport-orchestrator = { path = "../crates/ucr-transport-orchestrator" }
ucr-video = { path = "../crates/ucr-video" }

[[bin]]
name = "framing_parser"
path = "fuzz_targets/framing_parser.rs"
test = false
doc = false
bench = false

